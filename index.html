    // --- COMPRESSÃO DE IMAGEM VIA CANVAS ---
    const compressImageFile = (file, maxDimension = 640, quality = 0.78) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

    const formatPhoneBR = (value) => {
      const digits = (value || '').replace(/\D/g, '').slice(0, 11);
      if (digits.length <= 2) return digits.length ? `(${digits}` : '';
      if (digits.length <= 6) return `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
      if (digits.length <= 10) return `(${digits.slice(0, 2)}) ${digits.slice(2, 6)}-${digits.slice(6)}`;
      return `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
    };

      const fullNumber = digits.startsWith('55') && digits.length >= 12 ? digits : `55${digits}`;
      const encodedMsg = messageText ? `?text=${encodeURIComponent(messageText)}` : '';
      return `https://wa.me/${fullNumber}${encodedMsg}`;

      const total = h * 60 + m + minutesToAdd;
      const newH = String(Math.floor(total / 60) % 24).padStart(2, '0');
      const newM = String(total % 60).padStart(2, '0');
      return `${newH}:${newM}`;

        e.preventDefault();
        setLoginError('');

          if (idx >= 0) {
            const copy = [...prev];
            copy[idx] = cand;
            return copy;
          }
          return [cand, ...prev];
        });
        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sys_candidates').doc(cand.id).set(cand, { merge: true });
          } catch (e) {
            console.error("Erro ao salvar candidato na nuvem:", e);
            showToast("Erro ao sincronizar com a nuvem.", "error");

        return cand;

      const removeCandidate = async (id) => {

            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sys_candidates').doc(id).delete();
            showToast('Candidato apagado com sucesso!');

            console.error("Erro ao apagar candidato na nuvem:", e);

        textArea.focus();
        textArea.select();
        try {

    // --- VISÃO DA INTEGRAÇÃO ---
    function IntegracaoView({
      activeClass, questions, candidates, onSubmitCandidate,

      onOpenPublicSelfReg, onOpenLightbox

            </div>

            <div className="flex flex-wrap items-center gap-2 shrink-0">

              >
                <Icon name="copy" className="w-3.5 h-3.5" />
                <span>Copiar Link</span>
              </button>
              <button
                type="button"
                onClick={() => {
                  window.open(getSelfRegUrl(activeClass?.id), '_blank');
                }}
                className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1.5 cursor-pointer"
              >
                <Icon name="external-link" className="w-3.5 h-3.5" />
                <span>Abrir Página de Inscrição</span>
              </button>
            </div>
          </div>

          <div className="flex items-center gap-2 overflow-x-auto pb-1">
            {[
              { id: 'formulario', label: 'Nova Inscrição', icon: 'user-plus' },
              { id: 'inscritos', label: `Lista de Inscritos (${candidates.length})`, icon: 'users' }
            ].map(tab => {
              const active = integracaoTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => setIntegracaoTab(tab.id)}
                  className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2 whitespace-nowrap transition cursor-pointer ${
                    active ? 'bg-zinc-900 text-white shadow-sm' : 'bg-white text-zinc-600 border border-zinc-200 hover:bg-zinc-100 hover:text-zinc-900'
                  }`}
                >
                  <Icon name={tab.icon} className="w-4 h-4" />
                  <span>{tab.label}</span>
                </button>
              );

    // --- FORMULÁRIO DE INSCRIÇÃO ---
    function RegistrationView({ activeClass, questions, existingCandidates, onSubmitCandidate, showToast, isSelfService }) {
      const [answers, setAnswers] = useState({});
      const [spouseAnswers, setSpouseAnswers] = useState({});
      const [isCouple, setIsCouple] = useState(false);
      const [spouseMode, setSpouseMode] = useState('existing');
      const [spouseSearchTerm, setSpouseSearchTerm] = useState('');
      const [selectedSpouseId, setSelectedSpouseId] = useState('');
      const [spousePendingName, setSpousePendingName] = useState('');
      const [submittedSuccess, setSubmittedSuccess] = useState(false);
      const [lastSubmittedCandidate, setLastSubmittedCandidate] = useState(null);
      const [preLinkedPartner, setPreLinkedPartner] = useState(null);
      const [uploadingField, setUploadingField] = useState(null);
      const [spouseUploadingField, setSpouseUploadingField] = useState(null);

      const availableSpouses = useMemo(() => {
        return (existingCandidates || []).filter(c => {
          if (c.spouseId) return false;
          if (!spouseSearchTerm.trim()) return true;
          const name = getCandidateName(c).toLowerCase();
          return name.includes(spouseSearchTerm.toLowerCase());
        });
      }, [existingCandidates, spouseSearchTerm]);

      const matchingPendingPartner = useMemo(() => {
        const typedName = (answers['q-nome'] || '').trim().toLowerCase();
        if (typedName.length < 4 || preLinkedPartner) return null;
        return (existingCandidates || []).find(
          c => c.isCouple && !c.spouseId && c.spousePendingName && c.spousePendingName.trim().toLowerCase() === typedName
        ) || null;
      }, [answers, existingCandidates, preLinkedPartner]);

      const handleChange = (qId, val, qType) => {
        const formatted = qType === 'phone' ? formatPhoneBR(val) : val;
        setAnswers(prev => ({ ...prev, [qId]: formatted }));
      };

      const handleSpouseChange = (qId, val, qType) => {
        const formatted = qType === 'phone' ? formatPhoneBR(val) : val;
        setSpouseAnswers(prev => ({ ...prev, [qId]: formatted }));
      };

      const handlePhotoUpload = async (qId, file) => {
        if (!file) return;
        try {
          setUploadingField(qId);
          const dataUrl = await compressImageFile(file, 640, 0.78);
          handleChange(qId, dataUrl);
          showToast('Foto anexada com sucesso!');
        } catch (err) {
          showToast('Erro ao processar imagem.', 'error');
        } finally {
          setUploadingField(null);
        }
      };

      const handleSpousePhotoUpload = async (qId, file) => {
        if (!file) return;
        try {
          setSpouseUploadingField(qId);
          const dataUrl = await compressImageFile(file, 640, 0.78);
          handleSpouseChange(qId, dataUrl);
          showToast('Foto do cônjuge anexada com sucesso!');
        } catch (err) {
          showToast('Erro ao processar imagem do cônjuge.', 'error');
        } finally {
          setSpouseUploadingField(null);
        }
      };

      const isQuestionVisible = (q, currentAnswers) => {
        if (!q.conditionParentId) return true;
        const parentVal = currentAnswers[q.conditionParentId];
        return parentVal === q.conditionValue;
      };

      // Renderizador recursivo para perguntas e sub-perguntas derivadas em cascata
      const renderQuestionField = (q, currentAnswers, onChangeHandler, isSpouse = false) => {
        if (!q) return null;
        const subq = q.derivedQuestion;
        const currentVal = currentAnswers[q.id];
        const hasSubAnswer = currentVal !== undefined && currentVal !== '' && currentVal !== null;
        
        let matchesTrigger = true;
        if (subq && subq.triggerValue && subq.triggerValue.trim() !== '') {
          matchesTrigger = String(currentVal).trim().toLowerCase() === String(subq.triggerValue).trim().toLowerCase();
        }

        return (
          <div key={q.id} className="space-y-3">
            <div>
              <label className="block text-sm font-semibold text-zinc-900 mb-1.5">
                {q.label} {q.required && <span className="text-red-600">*</span>}
              </label>

              {q.type === 'photo' && (
                <div className="p-4 rounded-xl border-2 border-dashed border-zinc-300 bg-zinc-50/70">
                  {currentAnswers[q.id] ? (
                    <div className="flex items-center gap-4">
                      <img src={currentAnswers[q.id]} alt="Prévia" className="w-20 h-20 rounded-xl object-cover border" />
                      <button type="button" onClick={() => onChangeHandler(q.id, '', q.type)} className="px-3 py-1.5 bg-white border border-zinc-300 text-xs font-semibold rounded-lg cursor-pointer">
                        Remover Foto
                      </button>
                    </div>
                  ) : (
                    <label className="flex flex-col items-center justify-center py-4 cursor-pointer text-center">
                      <Icon name="camera" className="w-6 h-6 text-zinc-600 mb-2" />
                      <span className="text-xs font-semibold text-zinc-900">Clique para enviar foto</span>
                      <input type="file" accept="image/*" onChange={(e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        compressImageFile(file, 640, 0.78).then(dataUrl => onChangeHandler(q.id, dataUrl, q.type)).catch(() => showToast('Erro ao processar imagem.', 'error'));
                      }} className="hidden" />
                    </label>
                  )}
                </div>
              )}

              {(q.type === 'text' || q.type === 'phone' || q.type === 'date') && (
                <input
                  type={q.type === 'phone' ? 'tel' : q.type === 'date' ? 'date' : 'text'}
                  required={q.required}
                  value={currentAnswers[q.id] || ''}
                  onChange={(e) => onChangeHandler(q.id, e.target.value, q.type)}
                  placeholder={q.type === 'phone' ? '(85) 99999-9999' : 'Sua resposta'}
                  className="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-300 rounded-lg text-sm text-zinc-950 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white transition"
                />
              )}

              {q.type === 'textarea' && (
                <textarea
                  rows={3}
                  required={q.required}
                  value={currentAnswers[q.id] || ''}
                  onChange={(e) => onChangeHandler(q.id, e.target.value, q.type)}
                  placeholder="Escreva detalhadamente..."
                  className="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-300 rounded-lg text-sm text-zinc-950 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white transition"
                />
              )}

              {q.type === 'select' && (
                <select
                  required={q.required}
                  value={currentAnswers[q.id] || ''}
                  onChange={(e) => onChangeHandler(q.id, e.target.value, q.type)}
                  className="w-full px-3.5 py-2.5 bg-zinc-50 border border-zinc-300 rounded-lg text-sm text-zinc-950 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white transition cursor-pointer"
                >
                  <option value="">Selecione uma opção...</option>
                  {(q.options || []).map((opt, idx) => (
                    <option key={idx} value={opt}>{opt}</option>
                  ))}
                </select>
              )}
            </div>

            {/* Renderização recursiva da pergunta derivada (se preenchida e atender ao gatilho) */}
            {subq && hasSubAnswer && matchesTrigger && (
              <div className="pl-4 sm:pl-6 border-l-2 border-emerald-500/50 space-y-3 pt-2">
                {renderQuestionField(subq, currentAnswers, onChangeHandler, isSpouse)}
              </div>
            )}
          </div>
        );
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!activeClass?.isOpen) {
          showToast('As inscrições para esta turma estão encerradas.', 'error');
          return;
        }

        if (isCouple && spouseMode === 'pending') {
          const nameQ = questions.find(q => q.id === 'q-nome' || q.label.toLowerCase().includes('nome'));
          let spouseName = nameQ ? (spouseAnswers[nameQ.id] || '').trim() : '';
          if (!spouseName) {
            spouseName = (spouseAnswers['q-nome'] || '').trim();
          }
          if (!spouseName) {
            const foundEntry = Object.entries(spouseAnswers).find(([k, v]) => (k.includes('nome') || k === 'name') && typeof v === 'string' && v.trim().length > 1);
            if (foundEntry) spouseName = foundEntry[1].trim();
          }
          const invalidVals = ['sim', 'não', 'nao', 'em breve', 'solteiro', 'casado'];
          if (!spouseName || invalidVals.includes(spouseName.toLowerCase())) {
            showToast('Por favor, preencha o Nome Completo válido do cônjuge.', 'error');
            return;
          }
          spouseAnswers['q-nome'] = spouseName;
        }

        const newId = `cand-${Date.now()}`;
        let finalIsCouple = isCouple;
        let finalSpouseId = '';
        let finalPendingName = '';

        if (preLinkedPartner) {
          finalIsCouple = true;
          finalSpouseId = preLinkedPartner.id;
        } else if (isCouple && spouseMode === 'existing' && selectedSpouseId) {
          finalIsCouple = true;
          finalSpouseId = selectedSpouseId;
        } else if (isCouple && spouseMode === 'pending') {
          finalIsCouple = true;
          finalSpouseId = `cand-spouse-${Date.now()}`;
        } else if (isCouple && spouseMode === 'membro' && spousePendingName.trim()) {
          finalIsCouple = true;
          finalPendingName = spousePendingName.trim();
        } else if (isCouple && spouseMode === 'none') {
          finalIsCouple = true;
          finalPendingName = 'Cônjuge não participará do processo';
        } else if (matchingPendingPartner) {
          finalIsCouple = true;
          finalSpouseId = matchingPendingPartner.id;
        }

        const newCandidate = {
          id: newId,
          classId: activeClass.id,
          createdAt: new Date().toISOString(),
          isCouple: finalIsCouple,
          spouseId: spouseMode === 'pending' ? `cand-spouse-${Date.now()}` : finalSpouseId,
          spousePendingName: finalPendingName,
          answers,
          interviewerId: '',
          interviewStatus: 'pendente',
          evaluation: 'Aguardando Entrevista',
          notes: '',
          schedule: null,
          attendance: {},
          attendanceJustified: false
        };

        if (isCouple && spouseMode === 'pending') {
          const spouseCandidateId = `cand-spouse-${Date.now()}`;
          newCandidate.spouseId = spouseCandidateId;

          const spouseCandidateObj = {
            id: spouseCandidateId,
            classId: activeClass.id,
            createdAt: new Date().toISOString(),
            isCouple: true,
            spouseId: newId,
            spousePendingName: '',
            answers: spouseAnswers,
            interviewerId: '',
            interviewStatus: 'pendente',
            evaluation: 'Aguardando Entrevista',
            notes: '',
            schedule: null,
            attendance: {},
            attendanceJustified: false
          };

          await onSubmitCandidate(spouseCandidateObj);
        }

        const saved = await onSubmitCandidate(newCandidate);

        if (finalSpouseId && spouseMode !== 'pending') {
          const partner = existingCandidates.find(c => c.id === finalSpouseId) || preLinkedPartner;
          if (partner) {
            await onSubmitCandidate({
              ...partner,
              isCouple: true,
              spouseId: newId,
              spousePendingName: ''
            });
          }
        }

        setLastSubmittedCandidate(saved);
        setAnswers({});
        setSpouseAnswers({});
        setIsCouple(false);
        setSelectedSpouseId('');
        setSpouseSearchTerm('');
        setSpousePendingName('');
        setPreLinkedPartner(null);
        setSubmittedSuccess(true);
        showToast('Inscrição registrada com sucesso!');
      };

      return (
        <div className="max-w-2xl mx-auto">
          <div className="bg-white border border-zinc-200 rounded-2xl overflow-hidden shadow-sm">
            <div className="h-2 bg-emerald-600 w-full" />
            <div className="p-6 sm:p-8 border-b border-zinc-200">
              <h1 className="text-2xl font-bold text-zinc-950">{activeClass.name}</h1>
              <p className="text-sm text-zinc-600 mt-1">Preencha atentamente os dados abaixo para o processo de membresia.</p>
            </div>

            {submittedSuccess ? (
              <div className="p-8 text-center space-y-4">
                <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto">
                  <Icon name="check-circle-2" className="w-8 h-8" />
                </div>
                <h3 className="text-xl font-bold text-zinc-950">Inscrição Realizada com Sucesso!</h3>
                <button
                  onClick={() => {
                    setSubmittedSuccess(false);
                    setLastSubmittedCandidate(null);
                  }}
                  className="inline-flex items-center gap-2 px-5 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white text-sm font-semibold rounded-lg transition cursor-pointer"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span>Realizar Nova Inscrição</span>
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="p-6 sm:p-8 space-y-6">
                {questions.map((q) => {
                  if (!isQuestionVisible(q, answers)) return null;
                  if (q.id === 'q-estado-civil') return null; // Tratado no bloco final de Casado/Solteiro

                  return renderQuestionField(q, answers, handleChange, false);
                })}

                {/* BLOCO PADRÃO DE INSCRIÇÃO DE CASADO / SOLTEIRO (No final do formulário) */}
                <div className={`p-5 rounded-2xl space-y-4 border transition ${
                  !isCouple ? 'bg-sky-50/50 border-sky-200' : 'bg-rose-50/50 border-rose-200'
                }`}>
                  <div className="flex items-center gap-3">
                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${
                      !isCouple ? 'bg-sky-100 text-sky-600' : 'bg-rose-100 text-rose-600'
                    }`}>
                      <Icon name={!isCouple ? 'user' : 'heart'} className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-bold text-sm text-zinc-950">
                        {!isCouple ? 'Inscrição de Solteiro' : 'Inscrição de Casado'}
                      </h3>
                      <p className="text-xs text-zinc-500">
                        {!isCouple 
                          ? 'Preencha seus dados para o processo individual de membresia.' 
                          : 'As entrevistas são individuais, mas o sistema vincula as duas fichas e organiza os horários.'}
                      </p>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <button
                      type="button"
                      onClick={() => {
                        setIsCouple(false);
                        setSpouseMode('none');
                        setSelectedSpouseId('');
                        setSpousePendingName('');
                        setPreLinkedPartner(null);
                      }}
                      className={`py-3 px-4 rounded-xl font-bold text-sm transition cursor-pointer border ${
                        !isCouple ? 'bg-sky-600 text-white border-sky-600 shadow-sm' : 'bg-white text-zinc-600 border-zinc-200 hover:bg-zinc-50'
                      }`}
                    >
                      Solteiro
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setIsCouple(true);
                        setSpouseMode('existing');
                      }}
                      className={`py-3 px-4 rounded-xl font-bold text-sm transition cursor-pointer border ${
                        isCouple ? 'bg-rose-600 text-white border-rose-600 shadow-sm' : 'bg-white text-zinc-600 border-zinc-200 hover:bg-zinc-50'
                      }`}
                    >
                      Casado
                    </button>
                  </div>

                  {isCouple && (
                    <div className="space-y-3 pt-2 border-t border-rose-200">
                      <div className="pb-2">
                        <button
                          type="button"
                          onClick={() => {
                            // Mantém isCouple = true (Casado), limpa o modo de cônjuge para fechar as opções e rola para o envio
                            setSpouseMode('none');
                            setSelectedSpouseId('');
                            setSpousePendingName('');
                            setPreLinkedPartner(null);
                            showToast('Estado civil Casado registrado. Vamos para o envio da inscrição.');
                            const submitBtn = document.getElementById('submit-registration-btn');
                            if (submitBtn) {
                              submitBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              submitBtn.focus();
                            }
                          }}
                          className="w-full py-2.5 bg-zinc-200 hover:bg-zinc-300 text-zinc-800 text-xs font-bold rounded-lg transition cursor-pointer shadow-xs"
                        >
                          Vincular depois
                        </button>
                      </div>

                      {spouseMode !== 'none' && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div 
                            onClick={() => setSpouseMode('existing')}
                            className={`p-3.5 rounded-xl border cursor-pointer transition ${
                              spouseMode === 'existing' ? 'bg-white border-rose-600 shadow-2xs' : 'bg-white/60 border-rose-200 hover:bg-white'
                            }`}
                          >
                            <span className="font-bold text-xs text-zinc-950 block">1. Cônjuge já inscrito</span>
                            <span className="text-[11px] text-zinc-500 block mt-0.5">Vincular ficha existente</span>
                          </div>

                          <div 
                            onClick={() => setSpouseMode('pending')}
                            className={`p-3.5 rounded-xl border cursor-pointer transition ${
                              spouseMode === 'pending' ? 'bg-white border-rose-600 shadow-2xs' : 'bg-white/60 border-rose-200 hover:bg-white'
                            }`}
                          >
                            <span className="font-bold text-xs text-zinc-950 block">2. Inscrever cônjuge agora</span>
                            <span className="text-[11px] text-zinc-500 block mt-0.5">Criar ficha e entrevista</span>
                          </div>

                          <div 
                            onClick={() => setSpouseMode('membro')}
                            className={`p-3.5 rounded-xl border cursor-pointer transition ${
                              spouseMode === 'membro' ? 'bg-white border-rose-600 shadow-2xs' : 'bg-white/60 border-rose-200 hover:bg-white'
                            }`}
                          >
                            <span className="font-bold text-xs text-zinc-950 block">3. Cônjuge já é membro</span>
                            <span className="text-[11px] text-zinc-500 block mt-0.5">Registrar na ficha</span>
                          </div>

                          <div 
                            onClick={() => {
                              setSpouseMode('none');
                              setSpousePendingName('Cônjuge não participará do processo');
                              showToast('Cônjuge não participará selecionado. Estado civil Casado registrado.');
                              const submitBtn = document.getElementById('submit-registration-btn');
                              if (submitBtn) {
                                submitBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                submitBtn.focus();
                              }
                            }}
                            className={`p-3.5 rounded-xl border cursor-pointer transition ${
                              spousePendingName === 'Cônjuge não participará do processo' ? 'bg-white border-rose-600 shadow-2xs' : 'bg-white/60 border-rose-200 hover:bg-white'
                            }`}
                          >
                            <span className="font-bold text-xs text-zinc-950 block">4. Cônjuge não participará</span>
                            <span className="text-[11px] text-zinc-500 block mt-0.5">Processo individual</span>
                          </div>
                        </div>
                      )}

                      {spouseMode === 'existing' && (
                        <div className="space-y-2 pt-2">
                          {matchingPendingPartner && !preLinkedPartner && (
                            <div className="p-3 bg-amber-50 border border-amber-200 rounded-lg flex items-center justify-between gap-3 text-xs">
                              <span className="text-amber-900 font-medium">
                                Encontramos <strong>{getCandidateName(matchingPendingPartner)}</strong> aguardando vínculo.
                              </span>
                              <button
                                type="button"
                                onClick={() => setPreLinkedPartner(matchingPendingPartner)}
                                className="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded"
                              >
                                Vincular
                              </button>
                            </div>
                          )}

                          {preLinkedPartner && (
                            <div className="p-3 bg-emerald-100 border border-emerald-300 rounded-lg flex items-center justify-between text-xs font-bold text-emerald-900">
                              <span>Vinculado com: {getCandidateName(preLinkedPartner)}</span>
                              <button type="button" onClick={() => setPreLinkedPartner(null)} className="text-red-600 hover:underline">Remover</button>
                            </div>
                          )}

                          {!preLinkedPartner && (
                            <>
                              <input
                                type="text"
                                value={spouseSearchTerm}
                                onChange={(e) => setSpouseSearchTerm(e.target.value)}
                                placeholder="Pesquisar cônjuge por nome..."
                                className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs"
                              />
                              <select
                                value={selectedSpouseId}
                                onChange={(e) => setSelectedSpouseId(e.target.value)}
                                className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs font-semibold cursor-pointer"
                              >
                                <option value="">Selecione o cônjuge na lista...</option>
                                {availableSpouses.map(c => (
                                  <option key={c.id} value={c.id}>{getCandidateName(c)}</option>
                                ))}
                              </select>
                            </>
                          )}
                        </div>
                      )}

                      {spouseMode === 'pending' && (
                        <div className="space-y-4 pt-3 border-t border-rose-200">
                          <span className="text-xs font-bold text-rose-900 block">Preencha os dados do cônjuge (igual ao formulário de inscrição):</span>
                          {questions.map((q) => {
                            if (!isQuestionVisible(q, spouseAnswers)) return null;
                            if (q.id === 'q-estado-civil') return null;

                            return renderQuestionField(q, spouseAnswers, handleSpouseChange, true);
                          })}
                        </div>
                      )}

                      {spouseMode === 'membro' && (
                        <div className="pt-2">
                          <label className="block text-xs font-semibold text-zinc-800 mb-1">Nome Completo do Cônjuge (Já Membro)</label>
                          <input
                            type="text"
                            value={spousePendingName}
                            onChange={(e) => setSpousePendingName(e.target.value)}
                            placeholder="Nome do cônjuge..."
                            className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs"
                          />
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <button
                  id="submit-registration-btn"
                  type="submit"
                  className="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition shadow-sm cursor-pointer flex items-center justify-center gap-2"
                >
                  <Icon name="check-circle-2" className="w-5 h-5" />
                  <span>Enviar Inscrição Oficial</span>
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // --- MODAL DE DETALHES DO CANDIDATO ---
    function CandidateDetailModal({ candidate, questions, candidates, lessons, activeClass, onClose, onSelectCandidate, onOpenLightbox, saveCandidate, showToast, isOrganizerRole }) {
      const [isEditing, setIsEditing] = useState(false);
      const [editedAnswers, setEditedAnswers] = useState(candidate?.answers || {});

      useEffect(() => {
        setEditedAnswers(candidate?.answers || {});
        setIsEditing(false);
      }, [candidate]);

      const name = getCandidateName(candidate);
      const photo = getCandidatePhoto(candidate, questions);
      const spouse = candidate.spouseId ? candidates.find(c => c.id === candidate.spouseId) : null;

      const totalLessons = (lessons || []).length;
      const attendedCount = (lessons || []).filter(l => isLessonAttended(candidate, l.id)).length;
      const percent = totalLessons > 0 ? Math.round((attendedCount / totalLessons) * 100) : 0;
      const attendanceThreshold = activeClass?.attendanceThreshold ?? 60;
      const isLowAttendance = totalLessons > 0 && percent < attendanceThreshold;

      let effectiveEvaluation = candidate.evaluation || 'Aguardando Entrevista';
      let evalBoxBg = 'bg-zinc-50 border-zinc-200 text-zinc-900';

      if (isLowAttendance && !candidate.attendanceJustified) {
        effectiveEvaluation = 'Reprovado por Falta';
        evalBoxBg = 'bg-red-50 border-red-200 text-red-900';
      } else if (effectiveEvaluation.startsWith('Reprovado')) {
        evalBoxBg = 'bg-red-50 border-red-200 text-red-900';
      } else if (effectiveEvaluation.includes('Discipulado') || effectiveEvaluation.includes('Batismo')) {
        evalBoxBg = 'bg-sky-50 border-sky-200 text-sky-900';
      } else if (effectiveEvaluation.startsWith('Aprovado')) {
        evalBoxBg = 'bg-emerald-50 border-emerald-200 text-emerald-900';
      } else {
        evalBoxBg = 'bg-amber-50 border-amber-200 text-amber-900';
      }

      const handleToggleJustify = async () => {
        const nextState = !candidate.attendanceJustified;
        const updated = { ...candidate, attendanceJustified: nextState };
        await saveCandidate(updated);
        if (onSelectCandidate) onSelectCandidate(updated);
        showToast(nextState ? 'Faltas justificadas com sucesso! Status original restaurado.' : 'Justificativa removida.');
      };

      const handleSaveEditedAnswers = async (e) => {
        e.preventDefault();
        const updated = { ...candidate, answers: editedAnswers };
        await saveCandidate(updated);
        if (onSelectCandidate) onSelectCandidate(updated);
        setIsEditing(false);
        showToast('Dados de inscrição atualizados com sucesso!');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 no-print">
          <div className="bg-white rounded-2xl max-w-xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="p-5 bg-zinc-900 text-white flex items-center justify-between">
              <h3 className="font-bold text-base truncate pr-3">Ficha de Inscrição: {name}</h3>
              <button onClick={onClose} className="p-1 text-zinc-400 hover:text-white rounded-lg cursor-pointer">
                <Icon name="x-circle" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-6 overflow-y-auto space-y-4 text-sm">
              {photo && (
                <div className="text-center">
                  <img
                    src={photo}
                    alt="Foto"
                    className="w-24 h-24 rounded-full object-cover border-2 border-zinc-300 mx-auto shadow-sm cursor-pointer"
                    onClick={() => onOpenLightbox(photo, name)}
                  />
                </div>
              )}

              {spouse && (
                <div className="p-3.5 rounded-xl bg-rose-50 border border-rose-200 flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2 text-xs text-rose-950 font-semibold">
                    <Icon name="heart" className="w-4 h-4 text-rose-600" />
                    <span>Vínculo de Casal com:</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => onSelectCandidate(spouse)}
                    className="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-full transition cursor-pointer"
                  >
                    {getCandidateName(spouse).split(' ')[0]} (Ver Ficha)
                  </button>
                </div>
              )}

              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <h4 className="font-bold text-xs uppercase tracking-wider text-zinc-500">Respostas do Formulário</h4>
                  {saveCandidate && !isEditing && (
                    <button
                      type="button"
                      onClick={() => setIsEditing(true)}
                      className="px-3 py-1 bg-zinc-900 text-white text-xs font-bold rounded-lg cursor-pointer flex items-center gap-1.5 shadow-2xs"
                    >
                      <Icon name="edit-2" className="w-3.5 h-3.5" />
                      <span>Editar Dados de Inscrição</span>
                    </button>
                  )}
                </div>

                {isEditing ? (
                  <form onSubmit={handleSaveEditedAnswers} className="space-y-3 pt-2">
                    {questions.map(q => {
                      if (q.type === 'photo') return null;
                      return (
                        <div key={q.id}>
                          <label className="block text-xs font-semibold text-zinc-700 mb-1">{q.label}</label>
                          <input
                            type="text"
                            value={editedAnswers[q.id] || ''}
                            onChange={(e) => setEditedAnswers(prev => ({ ...prev, [q.id]: e.target.value }))}
                            className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs"
                          />
                        </div>
                      );
                    })}
                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => {
                          setEditedAnswers(candidate?.answers || {});
                          setIsEditing(false);
                        }}
                        className="px-3 py-1.5 bg-zinc-100 text-zinc-700 text-xs font-semibold rounded-lg cursor-pointer"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg cursor-pointer shadow-sm"
                      >
                        Salvar Alterações
                      </button>
                    </div>
                  </form>
                ) : (
                  <div className="space-y-2">
                    {questions.map(q => {
                      const val = candidate.answers?.[q.id];
                      if ((!val && val !== 0) || q.type === 'photo') return null;
                      return (
                        <div key={q.id} className="p-3 bg-zinc-50 rounded-xl border border-zinc-200">
                          <span className="font-semibold text-xs text-zinc-600 block">{q.label}</span>
                          <span className="text-zinc-950 block mt-0.5">{val}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {!isOrganizerRole && (
                <>
                  {/* Termômetro de Frequência */}
                  <div className="p-4 bg-orange-50/60 rounded-2xl border border-orange-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <div className="w-7 h-7 rounded-lg bg-orange-100 text-orange-700 flex items-center justify-center">
                          <Icon name="thermometer" className="w-4 h-4" />
                        </div>
                        <div>
                          <h4 className="font-bold text-xs uppercase tracking-wider text-orange-950">Termômetro de Frequência nas Aulas</h4>
                          <p className="text-[11px] text-orange-800">{attendedCount} de {totalLessons} aulas ({percent}%)</p>
                        </div>
                      </div>
                      <span className="text-base font-extrabold text-orange-700">{percent}%</span>
                    </div>

                    <div className="w-full bg-orange-100 h-3 rounded-full overflow-hidden p-0.5 border border-orange-200">
                      <div className="bg-orange-600 h-full rounded-full transition-all duration-500" style={{ width: `${percent}%` }} />
                    </div>
                  </div>

                  {/* Parecer / Status */}
                  <div className={`p-4 rounded-xl border space-y-3 ${evalBoxBg}`}>
                    <div className="flex items-center justify-between">
                      <h4 className="font-bold text-xs uppercase tracking-wider opacity-85">Parecer / Status</h4>
                      {isLowAttendance && saveCandidate && !isOrganizerRole && (
                        <button
                          type="button"
                          onClick={handleToggleJustify}
                          className="px-3 py-1 bg-white hover:bg-zinc-100 border border-zinc-300 rounded-lg text-xs font-bold text-zinc-800 transition cursor-pointer shadow-2xs"
                        >
                          {candidate.attendanceJustified ? 'Remover Justificativa' : 'Justificar Faltas'}
                        </button>
                      )}
                    </div>
                    <div>
                      <span className={getEvaluationBadgeClass(effectiveEvaluation)}>
                        {effectiveEvaluation}
                      </span>
                      {isLowAttendance && !candidate.attendanceJustified && (
                        <span className="text-[11px] text-red-700 block mt-1.5 font-medium">
                          Frequência abaixo de {attendanceThreshold}% (Reprovado automaticamente por falta).
                        </span>
                      )}
                    </div>
                    {candidate.notes && <p className="text-xs mt-1 opacity-90">Observações: {candidate.notes}</p>}
                  </div>
                </>
              )}

              <div className="pt-2 flex justify-end">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-5 py-2 bg-zinc-900 text-white text-xs font-semibold rounded-lg cursor-pointer"
                >
                  Fechar
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- VISÃO DO PERFIL CURSO ---
    function CursoView({ activeClass, lessons, candidates, saveLesson, removeLesson, saveCandidate, showToast, questions, candidatesAll, onOpenLightbox, saveClass }) {
      const [cursoSubTab, setCursoSubTab] = useState('chamada');

      const markAllPresent = async (lessonId) => {
        for (const cand of candidates) {
          const attendance = cand.attendance || {};
          const updatedAttendance = { ...attendance, [lessonId]: true };
          await saveCandidate({ ...cand, attendance: updatedAttendance });
        }
        showToast('Todos marcados como presentes nesta aula!');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-zinc-200 pb-4 gap-3">
              <div>
                <h2 className="font-bold text-base text-zinc-950">Equipe de Curso ({activeClass?.name})</h2>
                <p className="text-xs text-zinc-500">Realize a chamada e acompanhe o resumo de frequência dos alunos.</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setCursoSubTab('chamada')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer ${
                    cursoSubTab === 'chamada' ? 'bg-orange-600 text-white' : 'bg-zinc-100 text-zinc-700 hover:bg-zinc-200'
                  }`}
                >
                  Chamada de Aulas
                </button>
                <button
                  type="button"
                  onClick={() => setCursoSubTab('resumo')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer ${
                    cursoSubTab === 'resumo' ? 'bg-orange-600 text-white' : 'bg-zinc-100 text-zinc-700 hover:bg-zinc-200'
                  }`}
                >
                  Resumo de Frequência
                </button>
              </div>
            </div>
          </div>

          {cursoSubTab === 'chamada' ? (
            <div className="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm space-y-6">
              <h3 className="font-bold text-sm uppercase text-zinc-900">Lista de Aulas e Chamada ({lessons.length} aulas)</h3>
              
              {lessons.length === 0 ? (
                <p className="text-xs text-zinc-500 text-center py-6">Nenhuma aula cadastrada pela coordenação no momento.</p>
              ) : (
                <div className="space-y-6">
                  {lessons.map(lesson => (
                    <div key={lesson.id} className="border border-zinc-200 rounded-2xl p-5 space-y-4 bg-zinc-50/50">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-zinc-200 pb-3">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-sm text-orange-700">Aula #{lesson.number}</span>
                            <span className="text-xs font-semibold text-zinc-500">({lesson.date.split('-').reverse().join('/')})</span>
                          </div>
                          <h4 className="font-bold text-base text-zinc-950">{lesson.title}</h4>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={() => markAllPresent(lesson.id)}
                            className="px-3 py-1.5 bg-orange-100 hover:bg-orange-200 text-orange-900 text-xs font-bold rounded-lg transition cursor-pointer"
                          >
                            Marcar Todos Presentes
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                        {candidates.map(cand => {
                          const name = getCandidateName(cand);
                          const attStatus = cand.attendance?.[lesson.id];
                          let statusLabel = 'Presente';
                          let statusColor = 'bg-orange-600 text-white';
                          if (attStatus === false) {
                            statusLabel = 'Ausente';
                            statusColor = 'bg-zinc-100 text-zinc-600 hover:bg-zinc-200';
                          } else if (attStatus === 'justificado') {
                            statusLabel = 'Justificado';
                            statusColor = 'bg-amber-100 text-amber-800 hover:bg-amber-200';
                          }

                          const handleCycleAttendance = async () => {
                            const attendance = cand.attendance || {};
                            let nextVal;
                            // Ciclo: Presente (true/undefined) -> Ausente (false) -> Justificado ('justificado') -> Presente (true)
                            if (attStatus === true || attStatus === undefined) nextVal = false;
                            else if (attStatus === false) nextVal = 'justificado';
                            else nextVal = true;

                            const updatedAttendance = { ...attendance, [lesson.id]: nextVal };
                            await saveCandidate({ ...cand, attendance: updatedAttendance });
                            showToast('Presença atualizada!');
                          };

                          return (
                            <div key={cand.id} className="p-3 bg-white rounded-xl border border-zinc-200 flex items-center justify-between gap-2 shadow-2xs">
                              <span className="font-semibold text-xs text-zinc-950 truncate">
                                {name}
                              </span>
                              <button
                                type="button"
                                onClick={handleCycleAttendance}
                                className={`px-3 py-1 rounded-lg text-xs font-bold transition cursor-pointer shrink-0 ${statusColor}`}
                              >
                                {statusLabel}
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ) : (
            <div className="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm space-y-4">
              <div>
                <h3 className="font-bold text-base text-zinc-950">Resumo de Frequência dos Alunos</h3>
                <p className="text-xs text-zinc-500">Acompanhe o percentual de presença de cada aluno nas aulas cadastradas.</p>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr className="bg-zinc-50 border-b border-zinc-200 text-[11px] font-bold uppercase tracking-wider text-zinc-500">
                      <th className="p-3.5">Aluno</th>
                      <th className="p-3.5">WhatsApp</th>
                      <th className="p-3.5">Presenças / Total</th>
                      <th className="p-3.5">Frequência</th>
                      <th className="p-3.5">Status Mínimo ({activeClass?.attendanceThreshold ?? 60}%)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-200">
                    {candidates.length === 0 ? (
                      <tr>
                        <td colSpan={5} className="p-8 text-center text-zinc-500 text-xs">Nenhum aluno inscrito encontrado.</td>
                      </tr>
                    ) : (
                      candidates.map(cand => {
                        const name = getCandidateName(cand);
                        const phone = getCandidatePhone(cand);
                        const totalL = lessons.length;
                        const attendedC = lessons.filter(l => isLessonAttended(cand, l.id)).length;
                        const pct = totalL > 0 ? Math.round((attendedC / totalL) * 100) : 0;
                        const threshold = activeClass?.attendanceThreshold ?? 60;
                        const isOk = pct >= threshold;

                        return (
                          <tr key={cand.id} className="hover:bg-zinc-50/80">
                            <td className="p-3.5">
                              <span className="font-semibold text-zinc-950">
                                {name}
                              </span>
                            </td>
                            <td className="p-3.5">
                              <WhatsAppButton phone={phone} candidateName={name} compact />
                            </td>
                            <td className="p-3.5 text-xs font-semibold text-zinc-800">
                              {attendedC} de {totalL} aulas
                            </td>
                            <td className="p-3.5">
                              <div className="flex items-center gap-2">
                                <span className="font-bold text-xs text-zinc-900">{pct}%</span>
                                <div className="w-24 bg-zinc-100 h-2 rounded-full overflow-hidden border">
                                  <div className={`h-full rounded-full ${isOk ? 'bg-emerald-600' : 'bg-red-600'}`} style={{ width: `${pct}%` }} />
                                </div>
                              </div>
                            </td>
                            <td className="p-3.5">
                              <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                                isOk ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                              }`}>
                                {isOk ? 'Apto (Acima do mínimo)' : 'Abaixo do Mínimo'}
                              </span>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- VISÃO DO ADMINISTRADOR / ORGANIZADOR ---
    function AdminView({
      isAdminRole, isOrganizerRole, adminTab, setAdminTab, activeClass, classes, setActiveClassId, saveClass, removeClass,
      questions, saveQuestion, removeQuestion, lessons, saveLesson, removeLesson, interviewQuestions, saveInterviewQuestion,
      removeInterviewQuestion, candidates, saveCandidate, removeCandidate, users, interviewers, saveUser, 
      removeUser, showToast, getSelfRegUrl, copySelfRegLink, onOpenPublicSelfReg, onOpenLightbox,
      currentCalendarDate, setCurrentCalendarDate
    }) {
      const [coupleFilter, setCoupleFilter] = useState('todos');
      const [interviewerFilter, setInterviewerFilter] = useState('todos');
      const [statusFilter, setStatusFilter] = useState('todos');
      const [sortBy, setSortBy] = useState('recentes');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCandidateDetail, setSelectedCandidateDetail] = useState(null);
      const [showPendingModal, setShowPendingModal] = useState(false);
      const [dashboardSubTab, setDashboardSubTab] = useState('inscricoes');
      const [formsSubTab, setFormsSubTab] = useState('inscricao');
      const [candidateToDelete, setCandidateToDelete] = useState(null);

      useEffect(() => {
        if (isOrganizerRole && adminTab === 'dashboard') {
          setAdminTab('inscricoes');
        }
      }, [isOrganizerRole, adminTab]);

      const pendingBreakdown = useMemo(() => {
        const baptism = candidates.filter(c => {
          const evalInc = (c.evaluation || '').toLowerCase().includes('batismo');
          const ansHasBaptism = Object.entries(c.answers || {}).some(([k, v]) => {
            const qObj = questions.find(q => q.id === k);
            const label = qObj ? qObj.label.toLowerCase() : k.toLowerCase();
            const valStr = String(v || '').toLowerCase().trim();
            if (label.includes('batismo')) {
              return valStr && (valStr.includes('não') || valStr.includes('nao') || valStr.includes('breve') || (valStr !== 'sim' && valStr !== ''));
            }
            return valStr && (valStr.includes('não') || valStr.includes('nao') || valStr.includes('breve'));
          });
          return evalInc || ansHasBaptism;
        });
        const discipleship = candidates.filter(c => (c.evaluation || '').toLowerCase().includes('discipulado'));
        const rescheduling = candidates.filter(c => c.schedule?.status === 'Reagendar' || c.schedule?.status === 'Faltou');
        return { baptism, discipleship, rescheduling };
      }, [candidates, questions]);

      const stats = useMemo(() => {
        const total = candidates.length;
        const approved = candidates.filter(c => {
          const totalL = lessons.length;
          const attC = lessons.filter(l => isLessonAttended(c, l.id)).length;
          const pct = totalL > 0 ? Math.round((attC / totalL) * 100) : 0;
          const thresh = activeClass?.attendanceThreshold ?? 60;
          const isLow = totalL > 0 && pct < thresh;
          const evalFinal = isLow && !c.attendanceJustified ? 'Reprovado por Falta' : (c.evaluation || '');
          return evalFinal.startsWith('Aprovado');
        }).length;

        const reproved = candidates.filter(c => {
          const totalL = lessons.length;
          const attC = lessons.filter(l => isLessonAttended(c, l.id)).length;
          const pct = totalL > 0 ? Math.round((attC / totalL) * 100) : 0;
          const thresh = activeClass?.attendanceThreshold ?? 60;
          const isLow = totalL > 0 && pct < thresh;
          const evalFinal = isLow && !c.attendanceJustified ? 'Reprovado por Falta' : (c.evaluation || '');
          return evalFinal.startsWith('Reprovado');
        }).length;
        
        // Estritamente pendências de batismo, discipulado e reagendamentos
        const pendingSet = new Set([
          ...pendingBreakdown.baptism.map(c => c.id),
          ...pendingBreakdown.discipleship.map(c => c.id),
          ...pendingBreakdown.rescheduling.map(c => c.id)
        ]);
        const pendingCases = pendingSet.size;

        return { total, approved, reproved, pendingCases };
      }, [candidates, pendingBreakdown, lessons, activeClass]);

      const filteredCandidates = useMemo(() => {
        const list = candidates.filter(c => {
          const name = getCandidateName(c).toLowerCase();
          const phone = (c.answers?.['q-telefone'] || '').toLowerCase();
          if (!name.includes(searchTerm.toLowerCase()) && !phone.includes(searchTerm.toLowerCase())) return false;
          if (coupleFilter === 'casais' && !c.isCouple) return false;
          if (coupleFilter === 'individuais' && c.isCouple) return false;
          if (interviewerFilter !== 'todos' && c.interviewerId !== interviewerFilter) return false;

          const totalL = lessons.length;
          const attC = lessons.filter(l => isLessonAttended(c, l.id)).length;
          const pct = totalL > 0 ? Math.round((attC / totalL) * 100) : 0;
          const thresh = activeClass?.attendanceThreshold ?? 60;
          const isLow = totalL > 0 && pct < thresh;
          const evalFinal = isLow && !c.attendanceJustified ? 'Reprovado por Falta' : (c.evaluation || '');

          if (statusFilter !== 'todos') {
            if (statusFilter === 'aprovados' && !evalFinal.startsWith('Aprovado')) return false;
            if (statusFilter === 'reprovados' && !evalFinal.startsWith('Reprovado')) return false;
            if (statusFilter === 'pendentes' && c.interviewStatus !== 'pendente') return false;
          }
          return true;
        });

        list.sort((a, b) => {
          const nameA = getCandidateName(a);
          const nameB = getCandidateName(b);
          const dateA = new Date(a.createdAt || 0);
          const dateB = new Date(b.createdAt || 0);
          if (sortBy === 'az') return nameA.localeCompare(nameB);
          if (sortBy === 'za') return nameB.localeCompare(nameA);
          if (sortBy === 'antigas') return dateA - dateB;
          return dateB - dateA;
        });

        return list;
      }, [candidates, searchTerm, coupleFilter, interviewerFilter, statusFilter, sortBy]);

      const handleAddRegistrationQuestion = async (e) => {
        e.preventDefault();
        if (!newQLabel.trim()) return;
        const opts = newQType === 'select' ? newQOptions.split(',').map(s => s.trim()).filter(Boolean) : [];
        await saveQuestion({
          id: `q-${Date.now()}`,
          label: newQLabel.trim(),
          type: newQType,
          required: newQRequired,
          options: opts,
          isCore: false,
          order: questions.length
        });
        setNewQLabel('');
        showToast('Pergunta de inscrição adicionada!');
      };

      const handleAddInterviewQuestion = async (e) => {
        e.preventDefault();
        if (!newIQLabel.trim()) return;
        const opts = newIQType === 'select' ? newIQOptions.split(',').map(s => s.trim()).filter(Boolean) : [];
        await saveInterviewQuestion({
          id: `iq-${Date.now()}`,
          label: newIQLabel.trim(),
          type: newIQType,
          required: newIQRequired,
          options: opts,
          order: interviewQuestions.length
        });
        setNewIQLabel('');
        showToast('Critério de entrevista adicionado!');
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center gap-2 overflow-x-auto pb-1 bg-white border border-zinc-200 rounded-2xl p-2 shadow-sm no-print">
            {[
              ...(isAdminRole ? [{ id: 'dashboard', label: 'Dashboard e Inscrições', icon: 'bar-chart-3' }] : []),
              ...(isAdminRole ? [{ id: 'aulas', label: 'Aulas e Chamada', icon: 'check-square' }] : []),
              { id: 'agenda', label: 'Agenda', icon: 'calendar' },
              ...(isAdminRole ? [{ id: 'formulario', label: 'Formulários e Perguntas', icon: 'file-text' }] : []),
              { id: 'turmas', label: 'Gerenciar Turmas', icon: 'layers' },
              ...(isAdminRole ? [{ id: 'usuarios', label: 'Usuários', icon: 'users' }] : []),
              ...(isAdminRole ? [{ id: 'relatorio', label: 'Relatórios', icon: 'printer' }] : [])
            ].map(tab => {
              const active = adminTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => setAdminTab(tab.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2 whitespace-nowrap transition cursor-pointer ${
                    active ? 'bg-zinc-900 text-white shadow-xs' : 'bg-transparent text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900'
                  }`}
                >
                  <Icon name={tab.icon} className="w-4 h-4" />
                  <span>{tab.label}</span>
                </button>
              );
            })}
          </div>

          {adminTab === 'dashboard' && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
                  <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">Total de Inscritos</span>
                  <span className="text-3xl font-extrabold text-zinc-950 block">{stats.total}</span>
                  <span className="text-xs text-zinc-500">Candidatos na turma {activeClass?.name}</span>
                </div>

                <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
                  <span className="text-xs font-bold uppercase tracking-wider text-emerald-600">Aprovados</span>
                  <span className="text-3xl font-extrabold text-emerald-700 block">{stats.approved}</span>
                  <span className="text-xs text-zinc-500">Aprovados e encaminhados</span>
                </div>

                <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
                  <span className="text-xs font-bold uppercase tracking-wider text-red-600">Reprovados</span>
                  <span className="text-3xl font-extrabold text-red-600 block">{stats.reproved}</span>
                  <span className="text-xs text-zinc-500">Não aptos no momento</span>
                </div>

                <div 
                  onClick={() => setShowPendingModal(true)}
                  className="bg-white border border-zinc-200 hover:border-amber-400 rounded-2xl p-5 shadow-sm space-y-1 cursor-pointer transition group"
                >
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold uppercase tracking-wider text-amber-600">Com Pendência</span>
                    <Icon name="chevron-right" className="w-4 h-4 text-zinc-400 group-hover:text-amber-600 transition" />
                  </div>
                  <span className="text-3xl font-extrabold text-amber-600 block">{stats.pendingCases}</span>
                  <span className="text-xs text-zinc-500">Clique para ver detalhes (Batismo, Discipulado, Reagendar)</span>
                </div>
              </div>

              {/* Termômetro de Aprovação Ocupando a Largura da Tela */}
              <div className="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center">
                      <Icon name="thermometer" className="w-4 h-4" />
                    </div>
                    <div>
                      <h3 className="font-bold text-sm text-zinc-950">Termômetro de Aprovação da Turma</h3>
                      <p className="text-xs text-zinc-500">Percentual de candidatos aprovados em relação ao total de inscritos</p>
                    </div>
                  </div>
                  <span className="text-xl font-extrabold text-emerald-700">
                    {stats.total > 0 ? Math.round((stats.approved / stats.total) * 100) : 0}%
                  </span>
                </div>
                <div className="w-full bg-zinc-100 h-4 rounded-full overflow-hidden p-0.5 border border-zinc-200">
                  <div 
                    className="bg-emerald-600 h-full rounded-full transition-all duration-500" 
                    style={{ width: `${stats.total > 0 ? Math.round((stats.approved / stats.total) * 100) : 0}%` }} 
                  />
                </div>
                <div className="flex items-center justify-between text-xs text-zinc-500 font-medium">
                  <span>{stats.approved} aprovados de {stats.total} total</span>
                  <span>{stats.reproved} reprovados • {stats.pendingCases} pendências</span>
                </div>
              </div>

              <div className="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm space-y-5">
                <div className="flex items-center gap-2 border-b border-zinc-200 pb-3">
                  <button
                    onClick={() => setDashboardSubTab('inscricoes')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer flex items-center gap-2 ${
                      dashboardSubTab === 'inscricoes' ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-600 border border-zinc-200 hover:bg-zinc-100'
                    }`}
                  >
                    <Icon name="users" className="w-4 h-4" />
                    <span>Lista de Inscrições</span>
                  </button>
                  <button
                    onClick={() => setDashboardSubTab('kanban')}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer flex items-center gap-2 ${
                      dashboardSubTab === 'kanban' ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-600 border border-zinc-200 hover:bg-zinc-100'
                    }`}
                  >
                    <Icon name="columns" className="w-4 h-4" />
                    <span>Visualização em Kanban</span>
                  </button>
                </div>

                {dashboardSubTab === 'inscricoes' ? (
                  <div className="space-y-4">
                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                      <div>
                        <h2 className="text-lg font-bold text-zinc-950">Gerenciamento de Inscrições ({filteredCandidates.length})</h2>
                        <p className="text-xs text-zinc-500">Filtre por entrevistadores, status ou tipo de casal.</p>
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        <div className="relative">
                          <Icon name="search" className="w-4 h-4 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2" />
                          <input
                            type="text"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            placeholder="Buscar nome..."
                            className="w-40 pl-9 pr-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-zinc-900"
                          />
                        </div>

                        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-zinc-50 border border-zinc-300 rounded-lg px-3 py-2 text-xs font-semibold text-zinc-800 cursor-pointer">
                          <option value="recentes">Mais Recentes</option>
                          <option value="antigas">Mais Antigas</option>
                          <option value="az">Nome (A-Z)</option>
                          <option value="za">Nome (Z-A)</option>
                        </select>

                        <select value={coupleFilter} onChange={(e) => setCoupleFilter(e.target.value)} className="bg-zinc-50 border border-zinc-300 rounded-lg px-3 py-2 text-xs font-semibold text-zinc-800 cursor-pointer">
                          <option value="todos">Todos</option>
                          <option value="casais">Somente Casais</option>
                          <option value="individuais">Somente Individuais</option>
                        </select>

                        <select value={interviewerFilter} onChange={(e) => setInterviewerFilter(e.target.value)} className="bg-zinc-50 border border-zinc-300 rounded-lg px-3 py-2 text-xs font-semibold text-zinc-800 cursor-pointer">
                          <option value="todos">Todos os Entrevistadores</option>
                          {interviewers.map(int => (
                            <option key={int.id} value={int.id}>{int.name}</option>
                          ))}
                        </select>

                        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="bg-zinc-50 border border-zinc-300 rounded-lg px-3 py-2 text-xs font-semibold text-zinc-800 cursor-pointer">
                          <option value="todos">Todos os Status</option>
                          <option value="aprovados">Aprovados</option>
                          <option value="reprovados">Reprovados</option>
                          <option value="pendentes">Pendentes</option>
                        </select>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse text-sm">
