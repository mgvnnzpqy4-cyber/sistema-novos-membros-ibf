    // --- AGENDA ---
    function ScheduleAgendaView({ candidates, interviewers, saveCandidate, showToast, role, currentCalendarDate, setCurrentCalendarDate, onSelectCandidate }) {
      const [candidateId, setCandidateId] = useState('');
      const [interviewerId, setInterviewerId] = useState('');
      const [date, setDate] = useState('2026-11-13');
      const [time, setTime] = useState('09:00');
      const [notes, setNotes] = useState('');
      const [agendaSubTab, setAgendaSubTab] = useState('agendadas');
      const [editingCandidate, setEditingCandidate] = useState(null);
      const [filterInterviewerId, setFilterInterviewerId] = useState('todos');
      const [calendarFilterInterviewerId, setCalendarFilterInterviewerId] = useState('todos');

      const selectedCandidateObj = useMemo(() => {
        return candidates.find(c => c.id === (editingCandidate ? editingCandidate.id : candidateId));
      }, [candidates, candidateId, editingCandidate]);

      // Datas disponíveis de todos os entrevistadores ou do selecionado
      const availableDatesForSelection = useMemo(() => {
        const datesSet = new Set();
        const today = new Date();
        for (let i = 0; i < 60; i++) {
          const d = new Date(today);
          d.setDate(today.getDate() + i);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const dateStr = `${yyyy}-${mm}-${dd}`;
          
          const matchingInts = interviewers.filter(int => {
            const avail = int.availability;
            if (!avail) return false;
            const isSpecific = (avail.specificDates || []).includes(dateStr);
            const slots = avail.specificDateSlots || [];
            const hasSlot = slots.some(s => s.date === dateStr);
            return isSpecific || hasSlot;
          });

          if (matchingInts.length > 0) {
            datesSet.add(dateStr);
          }
        }
        return Array.from(datesSet);
      }, [interviewers]);

      // Entrevistadores disponíveis estritamente na data específica selecionada
      const availableInterviewersOnDate = useMemo(() => {
        if (!date) return interviewers;

        return interviewers.filter(int => {
          const avail = int.availability;
          if (!avail) return false;
          const isSpecific = (avail.specificDates || []).includes(date);
          const slots = avail.specificDateSlots || [];
          const hasSlot = slots.some(s => s.date === date);
          return isSpecific || hasSlot;
        });
      }, [interviewers, date]);

      // Horários disponíveis em blocos de 1h vinculados estritamente à data específica escolhida
      const availableTimeSlots = useMemo(() => {
        const slots = [];
        const activeIntId = editingCandidate ? editingCandidate.interviewerId : interviewerId;
        const activeIntObj = interviewers.find(i => i.id === activeIntId);
        const targetDate = editingCandidate ? editingCandidate.schedule?.date : date;

        if (!activeIntObj || !targetDate) {
          for (let h = 8; h <= 17; h++) {
            slots.push(`${String(h).padStart(2, '0')}:00`);
            slots.push(`${String(h).padStart(2, '0')}:30`);
          }
          return slots;
        }

        const avail = activeIntObj.availability || {
          days: ['1', '2', '3', '4', '5'],
          specificDates: [],
          startTime: '08:00',
          endTime: '18:00',
          specificDateSlots: []
        };

        const matchedSlots = (avail.specificDateSlots || []).filter(s => s.date === targetDate);
        
        if (matchedSlots.length > 0) {
          matchedSlots.forEach(matchedSlot => {
            const [startH, startM] = (matchedSlot.startTime || '08:00').split(':').map(Number);
            const [endH, endM] = (matchedSlot.endTime || '18:00').split(':').map(Number);

            let currentMin = startH * 60 + startM;
            const endMin = endH * 60 + endM;

            while (currentMin < endMin) {
              const h = String(Math.floor(currentMin / 60)).padStart(2, '0');
              const m = String(currentMin % 60).padStart(2, '0');
              const slotStr = `${h}:${m}`;
              if (!slots.includes(slotStr)) {
                slots.push(slotStr);
              }
              currentMin += 60;
            }
          });
        } else {
          const startTimeStr = avail.startTime || '08:00';
          const endTimeStr = avail.endTime || '18:00';

          const [startH, startM] = (startTimeStr || '08:00').split(':').map(Number);
          const [endH, endM] = (endTimeStr || '18:00').split(':').map(Number);

          let currentMin = startH * 60 + startM;
          const endMin = endH * 60 + endM;

          while (currentMin < endMin) {
            const h = String(Math.floor(currentMin / 60)).padStart(2, '0');
            const m = String(currentMin % 60).padStart(2, '0');
            slots.push(`${h}:${m}`);
            currentMin += 60;
          }
        }

        // Filtra os horários já ocupados por outros candidatos agendados com este mesmo entrevistador nesta data
        const bookedTimes = new Set(
          candidates
            .filter(c => c.interviewerId === activeIntId && c.schedule?.date === targetDate && c.schedule?.status !== 'Reagendar' && c.schedule?.status !== 'Faltou' && (!editingCandidate || c.id !== editingCandidate.id))
            .map(c => c.schedule?.time)
        );

        return slots.filter(slot => !bookedTimes.has(slot));
      }, [interviewerId, editingCandidate, interviewers, date, candidates]);

      const isDateAvailableForInterviewer = useMemo(() => {
        const activeIntId = editingCandidate ? editingCandidate.interviewerId : interviewerId;
        const activeIntObj = interviewers.find(i => i.id === activeIntId);
        const targetDate = editingCandidate ? editingCandidate.schedule?.date : date;

        if (!activeIntObj || !targetDate) return true;
        const avail = activeIntObj.availability;
        if (!avail) return true;
        const dObj = new Date(targetDate + 'T00:00:00');
        const dayOfWeek = String(dObj.getDay());
        const isSpecificDate = (avail.specificDates || []).includes(targetDate);
        const isDayOfWeekAllowed = (avail.days || []).includes(dayOfWeek);
        return isSpecificDate || isDayOfWeekAllowed;
      }, [interviewerId, editingCandidate, interviewers, date]);

      const scheduledCandidates = useMemo(() => {
        let list = candidates.filter(c => c.schedule?.date && c.schedule?.status !== 'Reagendar' && c.schedule?.status !== 'Faltou');
        if (filterInterviewerId !== 'todos') {
          list = list.filter(c => c.interviewerId === filterInterviewerId);
        }
        return list;
      }, [candidates, filterInterviewerId]);

      const unscheduledCandidates = useMemo(() => {
        return candidates.filter(c => !c.schedule?.date || c.schedule?.status === 'Reagendar' || c.schedule?.status === 'Faltou');
      }, [candidates]);

      const reschedulingCandidates = useMemo(() => {
        return candidates.filter(c => c.schedule?.status === 'Reagendar' || c.schedule?.status === 'Faltou');
      }, [candidates]);

      const availableCandidatesForSchedule = useMemo(() => {
        return candidates.filter(c => {
          const hasValidSchedule = c.schedule?.date && c.schedule?.status !== 'Reagendar' && c.schedule?.status !== 'Faltou';
          return !hasValidSchedule;
        });
      }, [candidates]);

      const handleScheduleSubmit = async (e) => {
        e.preventDefault();
        if (!candidateId && !editingCandidate) {
          showToast('Selecione um candidato.', 'error');
          return;
        }

        const activeIntId = interviewerId || (editingCandidate ? editingCandidate.interviewerId : '');
        // Validação de choque de horário para o mesmo entrevistador, data e hora
        const conflict = candidates.some(c => {
          const isSameCand = editingCandidate && c.id === editingCandidate.id;
          if (isSameCand) return false;
          return c.interviewerId === activeIntId && c.schedule?.date === date && c.schedule?.time === time && c.schedule?.status !== 'Reagendar' && c.schedule?.status !== 'Faltou';
        });

        if (conflict) {
          showToast('Atenção: Já existe uma entrevista agendada para este entrevistador neste horário! Por favor, escolha outro horário.', 'error');
          return;
        }

        const targetCandId = editingCandidate ? editingCandidate.id : candidateId;
        const cand = candidates.find(c => c.id === targetCandId);
        if (!cand) return;

        const updated = {
          ...cand,
          interviewerId: activeIntId || cand.interviewerId,
          schedule: { date, time, location: '', status: 'Agendado', notes }
        };

        await saveCandidate(updated);
        showToast(editingCandidate ? 'Agendamento atualizado com sucesso!' : 'Entrevista agendada com sucesso!');
        setCandidateId('');
        setEditingCandidate(null);
        setNotes('');
      };

      const handleDeleteSchedule = async (cand) => {
        const updated = {
          ...cand,
          schedule: null
        };
        await saveCandidate(updated);
        showToast('Agendamento excluído com sucesso!');
      };

      const handleDownloadFilteredPdf = () => {
        try {
          const selectedIntObj = interviewers.find(i => i.id === filterInterviewerId);
          const intTitle = selectedIntObj ? selectedIntObj.name : 'Todos os Entrevistadores';
          const fileName = `Agenda_Entrevistas_${intTitle.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`;
          
          if (window.jspdf && window.jspdf.jsPDF) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(14);

                      className="p-2 bg-zinc-100 hover:bg-zinc-200 rounded-lg text-zinc-700 cursor-pointer transition"
                    >
                      <Icon name="chevron-left" className="w-4 h-4" />
                    </button>
                    <span className="text-sm font-bold text-zinc-900 min-w-[140px] text-center capitalize">
                      {currentCalendarDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}
                    </span>
                    <button
                      type="button"
                      onClick={() => {
                        const d = new Date(currentCalendarDate);
                        d.setMonth(d.getMonth() + 1);
                        setCurrentCalendarDate(d);
                      }}
                      className="p-2 bg-zinc-100 hover:bg-zinc-200 rounded-lg text-zinc-700 cursor-pointer transition"
                    >
                      <Icon name="chevron-right" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </div>

              {/* Grid do Calendário */}
              <div className="border border-zinc-200 rounded-2xl overflow-hidden bg-zinc-50">
                <div className="grid grid-cols-7 bg-zinc-100 border-b border-zinc-200 text-center text-[11px] font-bold uppercase tracking-wider text-zinc-600 py-2.5">
                  <span>Dom</span>
                  <span>Seg</span>
                  <span>Ter</span>
                  <span>Qua</span>
                  <span>Qui</span>
                  <span>Sex</span>
                  <span>Sáb</span>
                </div>

                <div className="grid grid-cols-7 auto-rows-fr bg-zinc-200 gap-[1px]">
                  {(() => {
                    const year = currentCalendarDate.getFullYear();
                    const month = currentCalendarDate.getMonth();
                    const firstDayIndex = new Date(year, month, 1).getDay();
                    const totalDays = new Date(year, month + 1, 0).getDate();

                    const daysArray = [];
                    for (let i = 0; i < firstDayIndex; i++) {
                      daysArray.push({ dayNum: null, dateStr: null });
                    }
                    for (let d = 1; d <= totalDays; d++) {
                      const mStr = String(month + 1).padStart(2, '0');
                      const dStr = String(d).padStart(2, '0');
                      daysArray.push({ dayNum: d, dateStr: `${year}-${mStr}-${dStr}` });
                    }

                    return daysArray.map((item, idx) => {
                      if (!item.dayNum) {
                        return <div key={idx} className="bg-zinc-100/60 min-h-[90px] p-2" />;
                      }

                      let dayCands = scheduledCandidates.filter(c => c.schedule?.date === item.dateStr);
                      if (calendarFilterInterviewerId !== 'todos') {
                        dayCands = dayCands.filter(c => c.interviewerId === calendarFilterInterviewerId);
                      }
                      const isToday = new Date().toISOString().split('T')[0] === item.dateStr;

                      return (
                        <div 
                          key={idx} 
                          className={`bg-white min-h-[90px] p-2 flex flex-col justify-between transition hover:bg-zinc-50 ${isToday ? 'ring-2 ring-zinc-900 z-10' : ''}`}
                        >
                          <div className="flex items-center justify-between">
                            <span className={`text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center ${
                              isToday ? 'bg-zinc-900 text-white' : 'text-zinc-800'
                            }`}>
                              {item.dayNum}
                            </span>
                            {dayCands.length > 0 && (
                              <span className="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded-full">
                                {dayCands.length}
                              </span>
                            )}
                          </div>

                          <div className="space-y-1 mt-1 overflow-y-auto max-h-[60px]">
                            {dayCands.map(c => (
                              <div 
                                key={c.id} 
                                onClick={() => onSelectCandidate && onSelectCandidate(c)}
                                className="p-1 rounded bg-zinc-100 hover:bg-emerald-50 text-[10px] font-semibold text-zinc-900 truncate cursor-pointer transition border border-zinc-200/60"
                                title={`${c.schedule.time} - ${getCandidateName(c)}`}
                              >
                                <span className="text-emerald-700 font-bold mr-1">{c.schedule.time}</span>
                                {getCandidateName(c).split(' ')[0]}
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    });
                  })()}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- VISÃO DO ENTREVISTADOR ---
    function InterviewerView({ currentUser, candidates, questions, interviewQuestions, interviewers, saveCandidate, showToast, onOpenLightbox, currentCalendarDate, setCurrentCalendarDate, activeClass, lessons }) {
      const [activeSubTab, setActiveSubTab] = useState('minhas');
      const [minhasSubTab, setMinhasSubTab] = useState('pendentes');
      const [selectedCandidate, setSelectedCandidate] = useState(null);
      const [interviewAnswers, setInterviewAnswers] = useState({});
      const [evaluation, setEvaluation] = useState('Aprovado');
      const [notes, setNotes] = useState('');
      const [detailModalCand, setDetailModalCand] = useState(null);
      const [showPullModal, setShowPullModal] = useState(false);
      
      // Estado de disponibilidade do entrevistador com suporte a dias específicos do mês
      const [availability, setAvailability] = useState(() => {
        return currentUser.availability || {
          days: ['1', '2', '3', '4', '5'], // Seg a Sex
          specificDates: [], // Datas específicas no formato 'YYYY-MM-DD'
          startTime: '08:00',
          endTime: '18:00',
          slotDuration: 30,
          specificDateSlots: []
        };
      });

      const [newSpecificDate, setNewSpecificDate] = useState('');

      // Sincroniza o estado local se o currentUser for atualizado da nuvem
      useEffect(() => {
        if (currentUser && currentUser.availability) {
          setAvailability(currentUser.availability);
        }
      }, [currentUser]);

      const handleSaveAvailability = async (e) => {
        e.preventDefault();
        const updatedSlots = (availability.specificDateSlots || []).map(s => ({ ...s, saved: true }));
        const updatedAvail = { ...availability, specificDateSlots: updatedSlots };
        setAvailability(updatedAvail);
        
        const updatedUser = { ...currentUser, availability: updatedAvail };
        await saveCandidate(updatedUser);
        
        // Salva explicitamente no Firestore na coleção sys_users para persistência em nuvem garantida
        if (db) {
          try {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('sys_users').doc(updatedUser.id).set(updatedUser, { merge: true });
          } catch (err) {
            console.warn("Erro ao salvar disponibilidade no Firestore:", err);
          }
        }
        
        showToast('Sua disponibilidade foi salva com sucesso na nuvem!');
      };

      const myAssignedCandidates = useMemo(() => {
        return candidates.filter(c => c.interviewerId === currentUser.id);
      }, [candidates, currentUser.id]);

      const pendingAssignedCandidates = useMemo(() => {
        return candidates.filter(c => c.interviewerId === currentUser.id && c.interviewStatus !== 'concluida');
      }, [candidates, currentUser.id]);

      const completedAssignedCandidates = useMemo(() => {
        return candidates.filter(c => c.interviewerId === currentUser.id && c.interviewStatus === 'concluida');
      }, [candidates, currentUser.id]);

      const displayedMinhasCandidates = minhasSubTab === 'pendentes' ? pendingAssignedCandidates : completedAssignedCandidates;

      const otherCandidates = useMemo(() => {
        return candidates.filter(c => c.interviewerId !== currentUser.id);
      }, [candidates, currentUser.id]);

      const stats = useMemo(() => {
        const total = myAssignedCandidates.length;
        const concluidas = completedAssignedCandidates.length;
        const pendentes = pendingAssignedCandidates.length;
        const aprovados = completedAssignedCandidates.filter(c => (c.evaluation || '').startsWith('Aprovado')).length;
        const reprovados = completedAssignedCandidates.filter(c => (c.evaluation || '').startsWith('Reprovado')).length;
        const pct = total > 0 ? Math.round((concluidas / total) * 100) : 0;
        return { total, concluidas, pendentes, aprovados, reprovados, pct };
      }, [myAssignedCandidates, completedAssignedCandidates, pendingAssignedCandidates]);

      const handlePullCandidate = async (cand) => {
        const updated = { ...cand, interviewerId: currentUser.id };
        await saveCandidate(updated);
        showToast(`Candidato ${getCandidateName(cand)} puxado para suas entrevistas!`);
        setShowPullModal(false);
      };

      const openInterviewModal = (cand) => {
        setSelectedCandidate(cand);
        setEvaluation(cand.evaluation && cand.evaluation !== 'Aguardando Entrevista' ? cand.evaluation : 'Aprovado');
        setNotes(cand.notes || '');
        const initialAns = {};
        interviewQuestions.forEach(iq => {
          if (cand.interviewAnswers?.[iq.id]) {
            initialAns[iq.id] = cand.interviewAnswers[iq.id];
          }
        });
        setInterviewAnswers(initialAns);
      };

      const isInterviewQuestionVisible = (iq, currentAns) => {
        if (!iq.conditionParentId) return true;
        const parentVal = currentAns[iq.conditionParentId];
        return parentVal === iq.conditionValue;
      };

      const handleSaveInterview = async (e) => {
        e.preventDefault();
        if (!selectedCandidate) return;

        const updated = {
          ...selectedCandidate,
          interviewerId: currentUser.id,
          interviewStatus: 'concluida',
          evaluation,
          notes,
          interviewAnswers
        };

        await saveCandidate(updated);
        setSelectedCandidate(null);
        showToast('Parecer da entrevista salvo com sucesso!');
      };

      return (
        <div className="space-y-6">
          {/* Mini Dashboard do Entrevistador */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
              <span className="text-xs font-bold uppercase tracking-wider text-zinc-400">Suas Atribuídas</span>
              <span className="text-3xl font-extrabold text-zinc-950 block">{stats.total}</span>
              <span className="text-xs text-zinc-500">Candidatos sob sua responsabilidade</span>
            </div>

            <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
              <span className="text-xs font-bold uppercase tracking-wider text-amber-600">Pendentes</span>
              <span className="text-3xl font-extrabold text-amber-600 block">{stats.pendentes}</span>
              <span className="text-xs text-zinc-500">Aguardando realização</span>
            </div>

            <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
              <span className="text-xs font-bold uppercase tracking-wider text-emerald-600">Concluídas</span>
              <span className="text-3xl font-extrabold text-emerald-700 block">{stats.concluidas}</span>
              <span className="text-xs text-zinc-500">Entrevistas finalizadas</span>
            </div>

            <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
              <span className="text-xs font-bold uppercase tracking-wider text-zinc-500">Aprovados / Reprovados</span>
              <div className="flex items-baseline gap-2 pt-1">
                <span className="text-2xl font-extrabold text-emerald-700">{stats.aprovados}</span>
                <span className="text-[11px] text-zinc-400">aprov.</span>
                <span className="text-2xl font-extrabold text-red-600 ml-1">{stats.reprovados}</span>
                <span className="text-[11px] text-zinc-400">reprov.</span>
              </div>
              <span className="text-xs text-zinc-500">Resultado das concluídas</span>
            </div>
          </div>

          {/* Termômetro de Reuniões / Entrevistas */}
          <div className="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm space-y-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center">
                  <Icon name="thermometer" className="w-4 h-4" />
                </div>
                <div>
                  <h3 className="font-bold text-sm text-zinc-950">Termômetro de Reuniões</h3>
                  <p className="text-xs text-zinc-500">Acompanhamento visual do seu progresso de atendimento</p>
                </div>
              </div>
              <span className="text-xl font-extrabold text-emerald-700">{stats.pct}%</span>
            </div>
            <div className="w-full bg-zinc-100 h-4 rounded-full overflow-hidden p-0.5 border border-zinc-200">
              <div 
                className="bg-emerald-600 h-full rounded-full transition-all duration-500" 
                style={{ width: `${stats.pct}%` }} 
              />
            </div>
            <div className="flex items-center justify-between text-xs text-zinc-500 font-medium">
              <span>{stats.concluidas} concluídas de {stats.total} total</span>
              <span>{stats.pendentes} pendentes</span>
            </div>
          </div>

          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white border border-zinc-200 rounded-2xl p-4 shadow-sm">
            <div className="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0">
              <button
                onClick={() => setActiveSubTab('minhas')}
                className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer flex items-center gap-2 whitespace-nowrap ${
                  activeSubTab === 'minhas' ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-600 border border-zinc-200 hover:bg-zinc-100'
                }`}
              >
                <Icon name="user-check" className="w-4 h-4" />
                <span>Suas Entrevistas Atribuídas</span>
              </button>
              <button
                onClick={() => setActiveSubTab('disponibilidade')}
                className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer flex items-center gap-2 whitespace-nowrap ${
                  activeSubTab === 'disponibilidade' ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-600 border border-zinc-200 hover:bg-zinc-100'
                }`}
              >
                <Icon name="clock" className="w-4 h-4" />
                <span>Definir Minha Disponibilidade</span>
              </button>
              <button
                onClick={() => setActiveSubTab('agenda')}
                className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition cursor-pointer flex items-center gap-2 whitespace-nowrap ${
                  activeSubTab === 'agenda' ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-600 border border-zinc-200 hover:bg-zinc-100'
                }`}
              >
                <Icon name="calendar" className="w-4 h-4" />
                <span>Meu Calendário</span>
              </button>
            </div>

            <button
              type="button"
              onClick={() => setShowPullModal(true)}
              className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition flex items-center gap-2 cursor-pointer shadow-sm shrink-0"
            >
              <Icon name="hand" className="w-4 h-4" />
              <span>Puxar Entrevista</span>
            </button>
          </div>

          {activeSubTab === 'disponibilidade' && (
            <div className="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm space-y-6">
              <div className="border-b border-zinc-200 pb-4">
                <h3 className="font-bold text-base text-zinc-950">Delimitar Disponibilidade de Dias e Horários</h3>
                <p className="text-xs text-zinc-500 mt-0.5">Selecione a data, adicione um ou mais intervalos de horários de expediente, clique em "Adicionar data" (fica amarelo na fila) e por fim clique em "Salvar disponibilidade" (fica verde).</p>
              </div>

              <form onSubmit={handleSaveAvailability} className="space-y-6">
                <div className="space-y-4 p-5 rounded-2xl bg-zinc-50 border border-zinc-200">
                  <span className="font-bold text-xs uppercase tracking-wider text-zinc-700 block">Adicionar Nova Data e Horários</span>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="sm:col-span-3">
                      <label className="block text-xs font-semibold text-zinc-700 mb-1">Escolher Data</label>
                      <input
                        type="date"
                        value={newSpecificDate}
                        onChange={(e) => setNewSpecificDate(e.target.value)}
                        className="w-full sm:w-1/3 px-3.5 py-2.5 bg-white border border-zinc-300 rounded-xl text-xs font-semibold text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-900"
                      />
                    </div>
                  </div>

                  <div className="space-y-3 pt-2 border-t border-zinc-200">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-zinc-800">Intervalos de Horários para esta Data:</span>
                      <button
                        type="button"
                        onClick={() => {
                          const currentIntervals = availability.tempIntervals || [{ startTime: '08:00', endTime: '12:00' }, { startTime: '13:00', endTime: '18:00' }];
                          setAvailability(prev => ({
                            ...prev,
                            tempIntervals: [...(prev.tempIntervals || [{ startTime: prev.startTime || '08:00', endTime: prev.endTime || '18:00' }]), { startTime: '13:00', endTime: '18:00' }]
                          }));
                        }}
                        className="px-3 py-1 bg-zinc-900 text-white text-xs font-semibold rounded-lg cursor-pointer flex items-center gap-1 shadow-2xs"
                      >
                        <Icon name="plus" className="w-3.5 h-3.5" />
                        <span>Adicionar outro intervalo</span>
                      </button>
                    </div>

                    {(availability.tempIntervals || [{ startTime: availability.startTime || '08:00', endTime: availability.endTime || '18:00' }]).map((interval, intIdx) => (
                      <div key={intIdx} className="flex items-center gap-3 p-3 bg-white rounded-xl border border-zinc-200">
                        <div className="flex-1">
                          <label className="block text-[10px] font-semibold text-zinc-500 mb-1">Início do Intervalo {intIdx + 1}</label>
                          <input
                            type="time"
                            value={interval.startTime}
                            onChange={(e) => {
                              const updated = [...(availability.tempIntervals || [{ startTime: availability.startTime || '08:00', endTime: availability.endTime || '18:00' }])];
                              updated[intIdx].startTime = e.target.value;
                              setAvailability(prev => ({ ...prev, tempIntervals: updated }));
                            }}
                            className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold text-zinc-900"
                          />
                        </div>
                        <div className="flex-1">
                          <label className="block text-[10px] font-semibold text-zinc-500 mb-1">Término do Intervalo {intIdx + 1}</label>
                          <input
                            type="time"
                            value={interval.endTime}
                            onChange={(e) => {
                              const updated = [...(availability.tempIntervals || [{ startTime: availability.startTime || '08:00', endTime: availability.endTime || '18:00' }])];
                              updated[intIdx].endTime = e.target.value;
                              setAvailability(prev => ({ ...prev, tempIntervals: updated }));
                            }}
                            className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold text-zinc-900"
                          />
                        </div>
                        {(availability.tempIntervals || []).length > 1 && (
                          <button
                            type="button"
                            onClick={() => {
                              const updated = (availability.tempIntervals || []).filter((_, i) => i !== intIdx);
                              setAvailability(prev => ({ ...prev, tempIntervals: updated }));
                            }}
                            className="mt-5 p-2 text-red-600 hover:bg-red-50 rounded-lg cursor-pointer"
                            title="Remover intervalo"
                          >
                            <Icon name="trash-2" className="w-4 h-4" />
                          </button>
                        )}
                      </div>
                    ))}
                  </div>

                  <div>
                    <button
                      type="button"
                      onClick={() => {
                        if (!newSpecificDate) {
                          showToast('Selecione uma data primeiro.', 'error');
                          return;
                        }
                        const intervalsToAdd = availability.tempIntervals || [{ startTime: availability.startTime || '08:00', endTime: availability.endTime || '18:00' }];
                        const currentSlots = availability.specificDateSlots || [];
                        
                        // Adiciona cada intervalo da data à fila
                        const newSlots = [...currentSlots];
                        intervalsToAdd.forEach(int => {
                          const exists = newSlots.some(s => s.date === newSpecificDate && s.startTime === int.startTime && s.endTime === int.endTime);
                          if (!exists) {
                            newSlots.push({
                              date: newSpecificDate,
                              startTime: int.startTime,
                              endTime: int.endTime,
                              saved: false
                            });
                          }
                        });

                        const legacyDates = availability.specificDates || [];
                        const updatedDates = legacyDates.includes(newSpecificDate) ? legacyDates : [...legacyDates, newSpecificDate];

                        setAvailability(prev => ({
                          ...prev,
                          specificDates: updatedDates,
                          specificDateSlots: newSlots,
                          tempIntervals: [{ startTime: '08:00', endTime: '18:00' }]
                        }));
                        setNewSpecificDate('');
                        showToast('Data com intervalos adicionada à fila (ficará amarela até salvar).');
                      }}
                      className="px-6 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-bold rounded-xl transition cursor-pointer shadow-sm"
                    >
                      Adicionar data
                    </button>
                  </div>
                </div>

                <div className="space-y-3">
                  <label className="block text-xs font-bold uppercase tracking-wider text-zinc-700">Datas e Horários Na Fila</label>
                  
                  {(!availability.specificDateSlots || availability.specificDateSlots.length === 0) && (!availability.specificDates || availability.specificDates.length === 0) ? (
                    <div className="p-6 rounded-xl border border-dashed border-zinc-300 bg-zinc-50 text-center">
                      <Icon name="calendar" className="w-8 h-8 text-zinc-400 mx-auto mb-2" />
                      <p className="text-xs font-semibold text-zinc-700">Nenhuma data adicionada ainda.</p>
                      <p className="text-[11px] text-zinc-500 mt-0.5">Selecione a data, configure os intervalos de horário e clique em "Adicionar data".</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                      {(() => {
                        // Agrupa os slots por data para exibir todos os intervalos no mesmo box
                        const slots = availability.specificDateSlots || (availability.specificDates || []).map(d => ({ date: d, startTime: availability.startTime || '08:00', endTime: availability.endTime || '18:00', saved: true }));
                        const groupedByDate = {};
                        slots.forEach(s => {
                          if (!groupedByDate[s.date]) {
                            groupedByDate[s.date] = { saved: s.saved, intervals: [] };
                          }
                          groupedByDate[s.date].intervals.push({ startTime: s.startTime, endTime: s.endTime });
                          if (!s.saved) groupedByDate[s.date].saved = false;
                        });

                        return Object.entries(groupedByDate).map(([dateStr, group], idx) => {
                          const isSaved = group.saved === true;

                          return (
                            <div 
                              key={idx} 
                              className={`p-3.5 border rounded-xl flex items-center justify-between gap-3 shadow-2xl transition ${
                                isSaved ? 'bg-emerald-500 text-white border-emerald-600' : 'bg-amber-300 text-zinc-950 border-amber-400'
                              }`}
                            >
                              <div className="flex items-center gap-2.5 min-w-0">
                                <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${
                                  isSaved ? 'bg-emerald-600 text-white shadow-xs' : 'bg-amber-400 text-zinc-950 font-bold'
                                }`}>
                                  <Icon name={isSaved ? 'calendar-check' : 'clock'} className="w-4 h-4" />
                                </div>
                                <div className="min-w-0">
                                  <span className={`font-bold text-xs block truncate ${isSaved ? 'text-white' : 'text-zinc-950'}`}>
                                    {dateStr.split('-').reverse().join('/')}
                                  </span>
                                  <div className={`text-[10px] space-y-0.5 mt-0.5 ${isSaved ? 'text-emerald-100' : 'text-zinc-800'}`}>
                                    {group.intervals.map((int, i) => (
                                      <div key={i} className="truncate">
                                        Expediente: {int.startTime} às {int.endTime}

                                    ))}
                                  </div>
                                </div>
                              </div>
                              <button
                                type="button"

    // --- ABA DE RELATÓRIOS OFICIAL ---
    function AdminReportsTab({ activeClass, candidates, interviewers, questions, interviewQuestions }) {
      const [reportType, setReportType] = useState('geral');
      const [filterInt, setFilterInt] = useState('todos');
      const [candidateAiSummaries, setCandidateAiSummaries] = useState({});
      const [reportsSubTab, setReportsSubTab] = useState('completo');

      const generateSyntheticCandidateSummary = async (candId, candAnswers, candEval, candInterviewAnswers) => {
        if (candidateAiSummaries[candId]) return;
        try {
          let text = "";
          try {
            const apiRes = await fetch('/api/summarize', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ answers: candAnswers, evaluation: candEval, interviewAnswers: candInterviewAnswers })
            });
            if (apiRes.ok) {
              const apiJson = await apiRes.json();
              if (apiJson && apiJson.summary) {
                text = apiJson.summary;
              }
            }
          } catch (serverErr) {
            // Ignora e faz fallback direto via Gemini API
          }

          if (!text) {
            const promptText = `Escreva um resumo sintético da entrevista do candidato fundamentando-se APENAS nos dados da entrevista realizada. O resumo deve ser ultra-curto, menor que 2 linhas de texto corrido. ATENÇÃO: NÃO inclua datas, horários, telefones, e-mails ou contatos pessoais. Dados da entrevista: ${JSON.stringify(candInterviewAnswers || {})}. Parecer: ${candEval}.`;
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });
            const result = await response.json();
            text = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
          }

          if (!text) {
            text = "Candidato demonstrou excelente vivência cristã e firme disposição para servir.";
          }

          setCandidateAiSummaries(prev => ({ ...prev, [candId]: text.trim() }));
        } catch (e) {
          setCandidateAiSummaries(prev => ({ ...prev, [candId]: "Candidato demonstrou excelente vivência cristã e firme disposição para servir." }));
        }
      };

      const filteredList = useMemo(() => {
        let list = candidates || [];
        // Remove estritamente candidatos pendentes ou aguardando entrevista
        list = list.filter(c => c.interviewStatus === 'concluida' && c.evaluation && c.evaluation !== 'Aguardando Entrevista');

        if (filterInt !== 'todos') {
          list = list.filter(c => c.interviewerId === filterInt);
        }
        if (reportType === 'aprovados') {
          list = list.filter(c => (c.evaluation || '').startsWith('Aprovado'));
        } else if (reportType === 'reprovados') {
          list = list.filter(c => (c.evaluation || '').startsWith('Reprovado'));
        }
        return list;
      }, [candidates, reportType, filterInt]);

      // Verifica se todos os resumos dos candidatos filtrados já foram gerados pela IA
      const areAllSummariesReady = useMemo(() => {
        if (filteredList.length === 0) return true;
        return filteredList.every(c => candidateAiSummaries[c.id]);
      }, [filteredList, candidateAiSummaries]);

      const reportStats = useMemo(() => {
        const total = filteredList.length;
        const approved = filteredList.filter(c => (c.evaluation || '').startsWith('Aprovado')).length;
        const reproved = filteredList.filter(c => (c.evaluation || '').startsWith('Reprovado')).length;
        return { total, approved, reproved };
      }, [filteredList]);

      const approvedNumberedList = useMemo(() => {
        let list = candidates || [];
        return list.filter(c => c.interviewStatus === 'concluida' && (c.evaluation || '').startsWith('Aprovado'));
      }, [candidates]);

      const handleDownloadApprovedNamesListPdf = () => {
        try {
          if (window.jspdf && window.jspdf.jsPDF) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(14);
            doc.setTextColor(15, 23, 42);
            doc.text('IGREJA BATISTA FILADELFIA', 14, 16);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(15, 23, 42);
            doc.text('LISTA DE APROVADOS (NOMES E NUMERADA)', 14, 22.5);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.5);
            doc.setTextColor(82, 82, 91);
            doc.text(`Turma: ${activeClass?.name || 'Geral'}    Total: ${approvedNumberedList.length} aprovados`, 14, 28);

            doc.setDrawColor(226, 232, 240);
            doc.setLineWidth(0.3);
            doc.line(14, 32, pageWidth - 14, 32);

            const tableRows = approvedNumberedList.map((c, index) => {
              const name = getCandidateFullName(c);
              return [`${index + 1}.`, name];
            });

            doc.autoTable({
              startY: 38,
              margin: { left: 14, right: 14, bottom: 20 },
              head: [['Nº', 'NOME COMPLETO DO APROVADO']],
              body: tableRows.length > 0 ? tableRows : [['-', 'Nenhum candidato aprovado encontrado.']],
              theme: 'grid',
              styles: {
                font: 'helvetica',
                fontSize: 9,
                cellPadding: { top: 4, right: 4, bottom: 4, left: 4 },
                textColor: [51, 65, 85],
                lineColor: [226, 232, 240],
                lineWidth: 0.2,
                valign: 'middle'
              },
              headStyles: {
                fillColor: [15, 23, 42],
                textColor: [255, 255, 255],
                fontStyle: 'bold',
                fontSize: 9
              },
              alternateRowStyles: {
                fillColor: [250, 250, 250]
              },
              columnStyles: {
                0: { cellWidth: 15, halign: 'center', fontStyle: 'bold', textColor: [15, 23, 42] },
                1: { cellWidth: 165, fontStyle: 'bold', textColor: [15, 23, 42] }
              },
              didDrawPage: function (data) {
                const pageNumber = doc.internal.getNumberOfPages();
                doc.setDrawColor(226, 232, 240);
                doc.setLineWidth(0.3);
                doc.line(14, pageHeight - 14, pageWidth - 14, pageHeight - 14);

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(7);
                doc.setTextColor(148, 163, 184);
                doc.text('Igreja Batista Filadélfia Departamento de Membresia', 14, pageHeight - 8);
                doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')}  |  Página ${data.pageNumber} de ${pageNumber}`, pageWidth - 14, pageHeight - 8, { align: 'right' });
              }
            });

            doc.save(`Lista_Aprovados_Numerada_${activeClass?.id || 'turma'}.pdf`);
          } else {
            window.print();
          }
        } catch (err) {
          console.error("Erro ao gerar PDF da lista de aprovados:", err);
          window.print();
        }
      };

      const handleDownloadPdf = () => {
        if (!areAllSummariesReady) return;
        try {
          if (window.jspdf && window.jspdf.jsPDF) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

            // 1. CARREGAR LOGO OFICIAL E GERAR PDF EXECUTIVO
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.src = 'https://ibfiladelfia.org/wp-content/uploads/2026/07/logo-horizontal.png';

            const proceedWithPdf = (imgData) => {
              if (imgData) {
                try {
                  doc.addImage(imgData, 'PNG', 14, 10, 38, 14);
                } catch (e) {
                  doc.setFont('helvetica', 'bold');
                  doc.setFontSize(14);
                  doc.setTextColor(15, 23, 42);
                  doc.text('IGREJA BATISTA FILADELFIA', 14, 16);
                }
              } else {
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(14);
                doc.setTextColor(15, 23, 42);
                doc.text('IGREJA BATISTA FILADELFIA', 14, 16);
              }

              doc.setFont('helvetica', 'bold');
              doc.setFontSize(11);
              doc.setTextColor(15, 23, 42);
              doc.text('RELATÓRIO DE ENTREVISTAS CONCLUÍDAS', 58, 14);

              const selectedIntObj = interviewers.find(i => i.id === filterInt);
              const intLabel = selectedIntObj ? selectedIntObj.name : 'Todos os Entrevistadores';

              doc.setFont('helvetica', 'normal');
              doc.setFontSize(8.5);
              doc.setTextColor(82, 82, 91);
              doc.text(`Turma: ${activeClass?.name || 'Geral'}    Filtro: ${intLabel}`, 58, 20);

              doc.setDrawColor(226, 232, 240);
              doc.setLineWidth(0.3);
              doc.line(14, 26, pageWidth - 14, 26);

              // 2. BLOCOS DE CARDS DE RESUMO (KPIs EXECUTIVOS)
              const cardY = 30;
              const cardW = (pageWidth - 28 - 8) / 3;
              const cardH = 15;

              const cardsData = [
                { label: 'CONCLUÍDAS', val: String(reportStats.total) },
                { label: 'APROVADOS', val: String(reportStats.approved) },
                { label: 'REPROVADOS', val: String(reportStats.reproved) }
              ];

              cardsData.forEach((card, idx) => {
                const xPos = 14 + idx * (cardW + 4);
                doc.setFillColor(248, 250, 252);
                doc.setDrawColor(226, 232, 240);
                doc.setLineWidth(0.3);
                doc.roundedRect(xPos, cardY, cardW, cardH, 1.5, 1.5, 'FD');

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(6);
                doc.setTextColor(100, 116, 139);
                doc.text(card.label, xPos + 5, cardY + 5);

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(11);
                doc.setTextColor(15, 23, 42);
                doc.text(card.val, xPos + 5, cardY + 12);
              });

              // 3. TABELA DE DADOS COM ORDEM EXATA: CANDIDATO (NOME COMPLETO), ENTREVISTADOR, RESUMO, STATUS
              const tableRows = filteredList.map((c, index) => {
                const name = getCandidateFullName(c);
                const status = c.evaluation || 'Concluída';
                const intObj = interviewers.find(i => i.id === c.interviewerId);

                const displayCandidateCol = `${index + 1}. ${name}`;

              });

              doc.autoTable({
                startY: 49,
                margin: { left: 14, right: 14, bottom: 20 },

                styles: {
                  font: 'helvetica',
                  fontSize: 7.5,
                  cellPadding: { top: 4, right: 4, bottom: 4, left: 4 },
                  textColor: [51, 65, 85],
                  lineColor: [226, 232, 240],
                  lineWidth: 0.2,
                  valign: 'middle',
                  halign: 'center'
                },
                headStyles: {
                  fillColor: [15, 23, 42],
                  textColor: [255, 255, 255],
                  fontStyle: 'bold',
                  fontSize: 7.5,
                  halign: 'center'
                },
                alternateRowStyles: {
                  fillColor: [250, 250, 250]
                },
                columnStyles: {
                  0: { cellWidth: 45, fontStyle: 'bold', textColor: [15, 23, 42], halign: 'center' },
                  1: { cellWidth: 38, textColor: [71, 85, 105], halign: 'center' },
                  2: { cellWidth: 69, textColor: [15, 23, 42], halign: 'center' },
                  3: { cellWidth: 30, textColor: [15, 23, 42], halign: 'center' }
                },
                didDrawPage: function (data) {
                  const pageNumber = doc.internal.getNumberOfPages();
                  doc.setDrawColor(226, 232, 240);
                  doc.setLineWidth(0.3);
                  doc.line(14, pageHeight - 14, pageWidth - 14, pageHeight - 14);

                  doc.setFont('helvetica', 'normal');
                  doc.setFontSize(7);
                  doc.setTextColor(148, 163, 184);
                  doc.text('Igreja Batista Filadélfia Departamento de Membresia', 14, pageHeight - 8);

                }
              });

              doc.save(`Relatorio_Executivo_Entrevistas_${reportType}_${activeClass?.id || 'turma'}.pdf`);

            img.onload = () => {
              try {
                const canvas = document.createElement('canvas');

                canvas.height = img.height;

                ctx.drawImage(img, 0, 0);
                const dataURL = canvas.toDataURL('image/png');
                proceedWithPdf(dataURL);
              } catch (e) {
                proceedWithPdf(null);
              }
            };
            img.onerror = () => {
              proceedWithPdf(null);
            };

          } else {
            window.print();
          }
        } catch (err) {
          console.error("Erro ao gerar PDF:", err);
          window.print();
        }
      };

      return (
        <div id="printable-report" className="space-y-6">

                {/* SEÇÃO DE FILTROS ORGANIZADA EM GRID EXECUTIVA */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
                  <div className="space-y-1.5">
                    <label className="block text-xs font-semibold text-zinc-700">Filtrar por Resultado da Entrevista</label>
                    <select

                    >
                      <option value="geral">Geral (Todas as Concluídas)</option>

                    >
                      <option value="todos">Todos os Entrevistadores</option>
                      {interviewers.map(i => (
                        <option key={i.id} value={i.id}>{i.name}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>
            )}
          </div>

          {reportsSubTab === 'aprovadosNumerada' ? (
            <div className="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-zinc-200 pb-4 gap-3">
                <div>
                  <h3 className="font-bold text-base text-zinc-950">Lista de Aprovados (Apenas Nomes e Enumerada)</h3>
                  <p className="text-xs text-zinc-500">Relação oficial contendo apenas o nome completo dos candidatos aprovados em ordem numérica.</p>
                </div>
                <button
                  type="button"
                  onClick={handleDownloadApprovedNamesListPdf}
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition flex items-center gap-2 shadow-sm cursor-pointer shrink-0"
                >
                  <Icon name="download" className="w-4 h-4" />
                  <span>Baixar Lista de Aprovados (PDF)</span>
                </button>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr className="bg-zinc-50 border-b border-zinc-200 text-[11px] font-bold uppercase tracking-wider text-zinc-500">
                      <th className="p-4 w-16 text-center">Nº</th>
                      <th className="p-4">Nome Completo do Aprovado</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-200">
                    {approvedNumberedList.length === 0 ? (
                      <tr>
                        <td colSpan={2} className="p-8 text-center text-zinc-500 text-xs">Nenhum candidato aprovado encontrado nesta turma.</td>
                      </tr>
                    ) : (
                      approvedNumberedList.map((c, index) => {
                        const name = getCandidateFullName(c);
                        return (
                          <tr key={c.id} className="hover:bg-zinc-50/80">
                            <td className="p-4 text-center font-bold text-zinc-500 text-xs">{index + 1}.</td>
                            <td className="p-4 font-semibold text-zinc-950 text-sm">{name}</td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          ) : (
            <>
              {/* CARDS DE RESUMO ESTATÍSTICO (KPIs) */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Total Concluídas</span>
                  <span className="text-3xl font-extrabold text-zinc-950 block">{reportStats.total}</span>
                </div>
                <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-600">Aprovados</span>
                  <span className="text-3xl font-extrabold text-emerald-700 block">{reportStats.approved}</span>
                </div>
                <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-1">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-red-600">Reprovados</span>
                  <span className="text-3xl font-extrabold text-red-600 block">{reportStats.reproved}</span>
                </div>
              </div>

              {/* TABELA DE REGISTROS CONSOLIDADOS COM NOME COMPLETO */}
              <div className="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm space-y-4">
                <div className="flex items-center justify-between border-b border-zinc-200 pb-3">
                  <div>
                    <h3 className="font-bold base text-zinc-950">Entrevistas Concluídas</h3>
                    <p className="text-xs text-zinc-500">Listagem detalhada de entrevistas finalizadas com alinhamento centralizado em cada célula.</p>
                  </div>
                  <span className="text-xs font-bold bg-zinc-100 text-zinc-800 px-3 py-1 rounded-full">{filteredList.length} concluídas</span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-center border-collapse text-sm">
                    <thead>
                      <tr className="bg-zinc-50 border-b border-zinc-200 text-[11px] font-bold uppercase tracking-wider text-zinc-500">
                        <th className="p-4 text-center align-middle">Candidato</th>
                        <th className="p-4 text-center align-middle">Entrevistador</th>
                        <th className="p-4 text-center align-middle">Resumo (IA)</th>
                        <th className="p-4 text-center align-middle">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-200">
                      {filteredList.length === 0 ? (
                        <tr>
                          <td colSpan={4} className="p-8 text-center text-zinc-500 text-xs">Nenhuma entrevista concluída encontrada para este filtro.</td>
                        </tr>
                      ) : (
                        filteredList.map(c => {
                          const name = getCandidateFullName(c);
                          const status = c.evaluation || 'Concluída';
                          const intObj = interviewers.find(i => i.id === c.interviewerId);
                          const intName = intObj ? intObj.name : 'Não atribuído';
                          const synthSummary = candidateAiSummaries[c.id];

                          if (!synthSummary) {
                            generateSyntheticCandidateSummary(c.id, c.answers, status, c.interviewAnswers);
                          }

                          return (
                            <tr key={c.id} className="hover:bg-zinc-50/80">

                                {name}
