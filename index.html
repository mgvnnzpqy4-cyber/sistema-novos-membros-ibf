    }

    // --- GERENCIAMENTO DE PERGUNTAS DE INSCRIÇÃO ---
    function RegistrationQuestionsManager({ questions, saveQuestion, removeQuestion, showToast }) {
      const [newQLabel, setNewQLabel] = useState('');
      const [newQType, setNewQType] = useState('text');
      const [newQRequired, setNewQRequired] = useState(true);
      const [newQOptions, setNewQOptions] = useState('');
      const [isDerivedEnabled, setIsDerivedEnabled] = useState(false);
      const [derivedTriggerValue, setDerivedTriggerValue] = useState('');
      const [derivedLabel, setDerivedLabel] = useState('');
      const [derivedType, setDerivedType] = useState('text');
      const [derivedOptions, setDerivedOptions] = useState('');
      const [isSubDerivedEnabled, setIsSubDerivedEnabled] = useState(false);
      const [subDerivedTriggerValue, setSubDerivedTriggerValue] = useState('');
      const [subDerivedLabel, setSubDerivedLabel] = useState('');
      const [subDerivedType, setSubDerivedType] = useState('text');
      const [subDerivedOptions, setSubDerivedOptions] = useState('');
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [editingQuestion, setEditingQuestion] = useState(null);

      const handleAddRegistrationQuestion = async (e) => {
        e.preventDefault();
        if (!newQLabel.trim()) return;
        const opts = newQType === 'select' ? newQOptions.split(',').map(s => s.trim()).filter(Boolean) : [];
        const derivedOpts = derivedType === 'select' ? derivedOptions.split(',').map(s => s.trim()).filter(Boolean) : [];
        const subDerivedOpts = subDerivedType === 'select' ? subDerivedOptions.split(',').map(s => s.trim()).filter(Boolean) : [];

        const subDerivedObj = isSubDerivedEnabled && subDerivedLabel.trim() ? {
          id: `sdeq-${Date.now()}`,
          label: subDerivedLabel.trim(),
          type: subDerivedType,
          options: subDerivedOpts,
          triggerValue: subDerivedTriggerValue.trim()
        } : null;

        const derivedObj = isDerivedEnabled && derivedLabel.trim() ? {
          id: `dq-${Date.now()}`,
          label: derivedLabel.trim(),
          type: derivedType,
          options: derivedOpts,
          triggerValue: derivedTriggerValue.trim(),
          derivedQuestion: subDerivedObj
        } : null;

        await saveQuestion({
          id: `q-${Date.now()}`,
          label: newQLabel.trim(),
          type: newQType,
          required: newQRequired,
          options: opts,
          isCore: false,
          order: questions.length,
          derivedQuestion: derivedObj
        });
        setNewQLabel('');
        setNewQOptions('');
        setIsDerivedEnabled(false);
        setDerivedTriggerValue('');
        setDerivedLabel('');
        setDerivedOptions('');
        setIsSubDerivedEnabled(false);
        setSubDerivedTriggerValue('');
        setSubDerivedLabel('');
        setSubDerivedOptions('');
        showToast('Pergunta de inscrição com derivada condicional adicionada com sucesso!');
      };

      const handleSaveEditedQuestion = async (e) => {
        e.preventDefault();
        if (!editingQuestion || !editingQuestion.label.trim()) return;
        const opts = editingQuestion.type === 'select' ? (typeof editingQuestion.options === 'string' ? editingQuestion.options.split(',').map(s => s.trim()).filter(Boolean) : editingQuestion.options) : [];
        const derivedOpts = editingQuestion.derivedType === 'select' ? (typeof editingQuestion.derivedOptions === 'string' ? editingQuestion.derivedOptions.split(',').map(s => s.trim()).filter(Boolean) : editingQuestion.derivedOptions) : [];
        const subDerivedOpts = editingQuestion.subDerivedType === 'select' ? (typeof editingQuestion.subDerivedOptions === 'string' ? editingQuestion.subDerivedOptions.split(',').map(s => s.trim()).filter(Boolean) : editingQuestion.subDerivedOptions) : [];

        const subDerivedObj = editingQuestion.isSubDerivedEnabled && editingQuestion.subDerivedLabel ? {
          id: editingQuestion.derivedQuestion?.derivedQuestion?.id || `sdeq-${Date.now()}`,
          label: editingQuestion.subDerivedLabel.trim(),
          type: editingQuestion.subDerivedType || 'text',
          options: subDerivedOpts,
          triggerValue: editingQuestion.subDerivedTriggerValue?.trim() || ''
        } : null;

        const derivedObj = editingQuestion.isDerivedEnabled && editingQuestion.derivedLabel ? {
          id: editingQuestion.derivedQuestion?.id || `dq-${Date.now()}`,
          label: editingQuestion.derivedLabel.trim(),
          type: editingQuestion.derivedType || 'text',
          options: derivedOpts,
          triggerValue: editingQuestion.derivedTriggerValue?.trim() || '',
          derivedQuestion: subDerivedObj
        } : null;

        await saveQuestion({
          ...editingQuestion,
          options: opts,
          derivedQuestion: derivedObj
        });
        setEditingQuestion(null);
        showToast('Pergunta de inscrição atualizada com sucesso!');
      };

      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      };

      const handleDrop = async (e, targetIndex) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === targetIndex) return;

        const updatedQuestions = [...questions];
        const [movedItem] = updatedQuestions.splice(draggedIndex, 1);
        updatedQuestions.splice(targetIndex, 0, movedItem);

        for (let i = 0; i < updatedQuestions.length; i++) {
          const q = updatedQuestions[i];
          await saveQuestion({ ...q, order: i });
        }

        setDraggedIndex(null);
        showToast('Ordem das perguntas atualizada com sucesso!');
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-5 bg-zinc-50 border border-zinc-200 rounded-2xl p-5 h-fit space-y-4">
            <h3 className="font-bold text-sm uppercase text-zinc-900">
              Nova Pergunta
            </h3>
            <form onSubmit={handleAddRegistrationQuestion} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-zinc-600 mb-1">Título da Pergunta</label>
                <input type="text" required value={newQLabel} onChange={(e) => setNewQLabel(e.target.value)} placeholder="Ex: Qual o seu ministério anterior?" className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-zinc-600 mb-1">Tipo</label>
                  <select value={newQType} onChange={(e) => setNewQType(e.target.value)} className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs font-semibold">
                    <option value="text">Texto Curto</option>
                    <option value="textarea">Texto Longo</option>
                    <option value="select">Seleção</option>
                    <option value="phone">Telefone</option>
                    <option value="date">Data</option>
                    <option value="photo">Anexo de Foto</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-zinc-600 mb-1">Obrigatória?</label>
                  <select value={String(newQRequired)} onChange={(e) => setNewQRequired(e.target.value === 'true')} className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs font-semibold">
                    <option value="true">Sim</option>
                    <option value="false">Não</option>
                  </select>
                </div>
              </div>

              {newQType === 'select' && (
                <div>
                  <label className="block text-xs font-semibold text-zinc-600 mb-1">Opções (separadas por vírgula)</label>
                  <input type="text" value={newQOptions} onChange={(e) => setNewQOptions(e.target.value)} placeholder="Ex: Sim, Não" className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs" />
                </div>
              )}

              {/* Toggle Switch para Pergunta Derivada */}
              <div className="pt-3 border-t border-zinc-200 space-y-3">
                <div className="flex items-center justify-between">
                  <div>
                    <span className="font-bold text-xs text-zinc-900 block">Adicionar Pergunta Derivada</span>
                    <span className="text-[11px] text-zinc-500">Sub-pergunta ativada via toggle switch</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsDerivedEnabled(!isDerivedEnabled)}
                    className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                      isDerivedEnabled ? 'bg-emerald-600' : 'bg-zinc-300'
                    }`}
                  >
                    <span
                      className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${
                        isDerivedEnabled ? 'translate-x-5' : 'translate-x-0'
                      }`}
                    />
                  </button>
                </div>

                {isDerivedEnabled && (
                  <div className="p-3 bg-white rounded-xl border border-zinc-200 space-y-3 shadow-2xs">
                    <div>
                      <label className="block text-[11px] font-semibold text-zinc-600 mb-1">Qual resposta ativa esta pergunta derivada?</label>
                      <input type="text" value={derivedTriggerValue} onChange={(e) => setDerivedTriggerValue(e.target.value)} placeholder="Ex: Sim (ou deixe em branco para qualquer resposta)" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-zinc-600 mb-1">Título da Pergunta Derivada:</label>
                      <input type="text" value={derivedLabel} onChange={(e) => setDerivedLabel(e.target.value)} placeholder="Ex: Qual o nome do líder?" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Tipo</label>
                        <select value={derivedType} onChange={(e) => setDerivedType(e.target.value)} className="w-full px-2.5 py-1.5 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold">
                          <option value="text">Texto Curto</option>
                          <option value="textarea">Texto Longo</option>
                          <option value="select">Seleção</option>
                        </select>
                      </div>
                      {derivedType === 'select' && (
                        <div>
                          <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Opções (,)</label>
                          <input type="text" value={derivedOptions} onChange={(e) => setDerivedOptions(e.target.value)} placeholder="Op1, Op2" className="w-full px-2.5 py-1.5 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                        </div>
                      )}
                    </div>

                    {/* Sub-pergunta Derivada da Derivada (Cascata) */}
                    <div className="pt-2 border-t border-zinc-100 space-y-2">
                      <div className="flex items-center justify-between">
                        <div>
                          <span className="font-bold text-[11px] text-zinc-900 block">Derivada da Derivada</span>
                          <span className="text-[10px] text-zinc-500">Sub-sub-pergunta via toggle</span>
                        </div>
                        <button
                          type="button"
                          onClick={() => setIsSubDerivedEnabled(!isSubDerivedEnabled)}
                          className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                            isSubDerivedEnabled ? 'bg-emerald-600' : 'bg-zinc-300'
                          }`}
                        >
                          <span
                            className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${
                              isSubDerivedEnabled ? 'translate-x-4' : 'translate-x-0'
                            }`}
                          />
                        </button>
                      </div>

                      {isSubDerivedEnabled && (
                        <div className="p-2.5 bg-zinc-50 rounded-lg border border-zinc-200 space-y-2">
                          <div>
                            <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Qual resposta ativa esta sub-derivada?</label>
                            <input type="text" value={subDerivedTriggerValue} onChange={(e) => setSubDerivedTriggerValue(e.target.value)} placeholder="Ex: Outro" className="w-full px-2.5 py-1.5 bg-white border border-zinc-300 rounded-lg text-xs" />
                          </div>
                          <input type="text" value={subDerivedLabel} onChange={(e) => setSubDerivedLabel(e.target.value)} placeholder="Título da sub-sub-pergunta..." className="w-full px-2.5 py-1.5 bg-white border border-zinc-300 rounded-lg text-xs" />
                          <select value={subDerivedType} onChange={(e) => setSubDerivedType(e.target.value)} className="w-full px-2 py-1 bg-white border border-zinc-300 rounded-lg text-xs font-semibold">
                            <option value="text">Texto Curto</option>
                            <option value="textarea">Texto Longo</option>
                            <option value="select">Seleção</option>
                          </select>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>

              <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white text-xs font-semibold rounded-lg cursor-pointer shadow-sm">
                Adicionar Pergunta
              </button>
            </form>
          </div>
          <div className="lg:col-span-7 space-y-2.5">
            <p className="text-xs text-zinc-500 mb-2 font-medium">💡 Dica: Arraste e solte os itens abaixo para reposicionar a ordem das perguntas no formulário.</p>
            {questions.map((q, idx) => (
              <div
                key={q.id}
                draggable
                onDragStart={(e) => handleDragStart(e, idx)}
                onDragOver={(e) => handleDragOver(e, idx)}
                onDrop={(e) => handleDrop(e, idx)}
                className="p-3.5 bg-white rounded-xl border border-zinc-200 flex items-center justify-between gap-3 shadow-2xs cursor-grab active:cursor-grabbing hover:border-zinc-400 transition"
              >
                <div className="flex items-center gap-3 min-w-0">
                  <div className="text-zinc-400 shrink-0">
                    <Icon name="grip-vertical" className="w-4 h-4" />
                  </div>
                  <div className="min-w-0">
                    <span className="font-bold text-xs text-zinc-950 block truncate">{idx + 1}. {q.label}</span>
                    <span className="text-[10px] text-zinc-500 uppercase font-semibold">
                      Tipo: {q.type} {q.derivedQuestion ? `• [Possui Derivada (ativa com: "${q.derivedQuestion.triggerValue || 'qualquer'}") ${q.derivedQuestion.derivedQuestion ? ' em Cascata' : ''}]` : ''}
                    </span>
                  </div>
                </div>
                <div className="flex items-center gap-1 shrink-0">
                  <button type="button" onClick={() => setEditingQuestion({ 
                    ...q, 
                    options: q.options ? q.options.join(', ') : '', 
                    isDerivedEnabled: !!q.derivedQuestion, 
                    derivedTriggerValue: q.derivedQuestion?.triggerValue || '',
                    derivedLabel: q.derivedQuestion?.label || '', 
                    derivedType: q.derivedQuestion?.type || 'text', 
                    derivedOptions: q.derivedQuestion?.options ? q.derivedQuestion.options.join(', ') : '',
                    isSubDerivedEnabled: !!q.derivedQuestion?.derivedQuestion,
                    subDerivedTriggerValue: q.derivedQuestion?.derivedQuestion?.triggerValue || '',
                    subDerivedLabel: q.derivedQuestion?.derivedQuestion?.label || '',
                    subDerivedType: q.derivedQuestion?.derivedQuestion?.type || 'text',
                    subDerivedOptions: q.derivedQuestion?.derivedQuestion?.options ? q.derivedQuestion.derivedQuestion.options.join(', ') : ''
                  })} className="p-1.5 text-zinc-400 hover:text-zinc-900 rounded-lg cursor-pointer" title="Editar pergunta">
                    <Icon name="edit-2" className="w-4 h-4" />
                  </button>
                  {!q.isCore && (
                    <button type="button" onClick={() => removeQuestion(q.id)} className="p-1.5 text-zinc-400 hover:text-red-600 rounded-lg cursor-pointer" title="Apagar pergunta">
                      <Icon name="trash-2" className="w-4 h-4" />
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>

          {editingQuestion && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 no-print">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-zinc-200 pb-3">
                  <h3 className="font-bold text-base text-zinc-950">Editar Pergunta de Inscrição</h3>
                  <button onClick={() => setEditingQuestion(null)} className="p-1 text-zinc-400 hover:text-zinc-900 rounded-lg cursor-pointer">
                    <Icon name="x-circle" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveEditedQuestion} className="space-y-4 text-sm">
                  <div>
                    <label className="block text-xs font-semibold text-zinc-600 mb-1">Título da Pergunta</label>
                    <input type="text" required value={editingQuestion.label} onChange={(e) => setEditingQuestion(prev => ({ ...prev, label: e.target.value }))} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-zinc-600 mb-1">Tipo</label>
                      <select value={editingQuestion.type} onChange={(e) => setEditingQuestion(prev => ({ ...prev, type: e.target.value }))} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold">
                        <option value="text">Texto Curto</option>
                        <option value="textarea">Texto Longo</option>
                        <option value="select">Seleção</option>
                        <option value="phone">Telefone</option>
                        <option value="date">Data</option>
                        <option value="photo">Anexo de Foto</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-zinc-600 mb-1">Obrigatória?</label>
                      <select value={String(editingQuestion.required)} onChange={(e) => setEditingQuestion(prev => ({ ...prev, required: e.target.value === 'true' }))} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                      </select>
                    </div>
                  </div>

                  {editingQuestion.type === 'select' && (
                    <div>
                      <label className="block text-xs font-semibold text-zinc-600 mb-1">Opções (separadas por vírgula)</label>
                      <input type="text" value={editingQuestion.options} onChange={(e) => setEditingQuestion(prev => ({ ...prev, options: e.target.value }))} placeholder="Ex: Sim, Não" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                    </div>
                  )}

                  <div className="pt-3 border-t border-zinc-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="font-bold text-xs text-zinc-900 block">Pergunta Derivada</span>
                        <span className="text-[11px] text-zinc-500">Sub-pergunta ativada via toggle switch</span>
                      </div>
                      <button
                        type="button"
                        onClick={() => setEditingQuestion(prev => ({ ...prev, isDerivedEnabled: !prev.isDerivedEnabled }))}
                        className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                          editingQuestion.isDerivedEnabled ? 'bg-emerald-600' : 'bg-zinc-300'
                        }`}
                      >
                        <span
                          className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${
                            editingQuestion.isDerivedEnabled ? 'translate-x-5' : 'translate-x-0'
                          }`}
                        />
                      </button>
                    </div>

                    {editingQuestion.isDerivedEnabled && (
                      <div className="p-3 bg-zinc-50 rounded-xl border border-zinc-200 space-y-3">
                        <div>
                          <label className="block text-[11px] font-semibold text-zinc-600 mb-1">Qual resposta ativa esta pergunta derivada?</label>
                          <input type="text" value={editingQuestion.derivedTriggerValue || ''} onChange={(e) => setEditingQuestion(prev => ({ ...prev, derivedTriggerValue: e.target.value }))} placeholder="Ex: Sim" className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs" />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold text-zinc-600 mb-1">Título da Pergunta Derivada:</label>
                          <input type="text" value={editingQuestion.derivedLabel || ''} onChange={(e) => setEditingQuestion(prev => ({ ...prev, derivedLabel: e.target.value }))} placeholder="Ex: Especifique..." className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs" />
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Tipo</label>
                            <select value={editingQuestion.derivedType || 'text'} onChange={(e) => setEditingQuestion(prev => ({ ...prev, derivedType: e.target.value }))} className="w-full px-2.5 py-1.5 bg-white border border-zinc-300 rounded-lg text-xs font-semibold">
                              <option value="text">Texto Curto</option>
                              <option value="textarea">Texto Longo</option>
                              <option value="select">Seleção</option>
                            </select>
                          </div>
                          {editingQuestion.derivedType === 'select' && (
                            <div>
                              <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Opções (,)</label>
                              <input type="text" value={editingQuestion.derivedOptions || ''} onChange={(e) => setEditingQuestion(prev => ({ ...prev, derivedOptions: e.target.value }))} placeholder="Op1, Op2" className="w-full px-2.5 py-1.5 bg-white border border-zinc-300 rounded-lg text-xs" />
                            </div>
                          )}
                        </div>

                        <div className="pt-2 border-t border-zinc-200 space-y-2">
                          <div className="flex items-center justify-between">
                            <div>
                              <span className="font-bold text-[11px] text-zinc-900 block">Derivada da Derivada</span>
                            </div>
                            <button
                              type="button"
                              onClick={() => setEditingQuestion(prev => ({ ...prev, isSubDerivedEnabled: !prev.isSubDerivedEnabled }))}
                              className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                                editingQuestion.isSubDerivedEnabled ? 'bg-emerald-600' : 'bg-zinc-300'
                              }`}
                            >
                              <span
                                className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${
                                  editingQuestion.isSubDerivedEnabled ? 'translate-x-4' : 'translate-x-0'
                                }`}
                              />
                            </button>
                          </div>

                          {editingQuestion.isSubDerivedEnabled && (
                            <div className="p-2 bg-white rounded-lg border border-zinc-200 space-y-2">
                              <div>
                                <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Qual resposta ativa esta sub-derivada?</label>
                                <input type="text" value={editingQuestion.subDerivedTriggerValue || ''} onChange={(e) => setEditingQuestion(prev => ({ ...prev, subDerivedTriggerValue: e.target.value }))} placeholder="Ex: Outro" className="w-full px-2 py-1 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                              </div>
                              <input type="text" value={editingQuestion.subDerivedLabel || ''} onChange={(e) => setEditingQuestion(prev => ({ ...prev, subDerivedLabel: e.target.value }))} placeholder="Título da sub-sub-pergunta..." className="w-full px-2 py-1 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                              <select value={editingQuestion.subDerivedType || 'text'} onChange={(e) => setEditingQuestion(prev => ({ ...prev, subDerivedType: e.target.value }))} className="w-full px-2 py-1 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold">
                                <option value="text">Texto Curto</option>
                                <option value="textarea">Texto Longo</option>
                                <option value="select">Seleção</option>
                              </select>
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-zinc-200">
                    <button type="button" onClick={() => setEditingQuestion(null)} className="px-4 py-2 bg-zinc-100 text-zinc-700 text-xs font-semibold rounded-lg cursor-pointer">
                      Cancelar
                    </button>
                    <button type="submit" className="px-5 py-2 bg-zinc-900 text-white text-xs font-semibold rounded-lg cursor-pointer shadow-sm">
                      Salvar Alterações
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- GERENCIAMENTO DE PERGUNTAS DE ENTREVISTA ---
    function InterviewQuestionsManager({ interviewQuestions, saveInterviewQuestion, removeInterviewQuestion, showToast }) {
      const [newIQLabel, setNewIQLabel] = useState('');
      const [newIQType, setNewIQType] = useState('textarea');
      const [newIQRequired, setNewIQRequired] = useState(true);
      const [newIQOptions, setNewIQOptions] = useState('');
      const [isDerivedEnabled, setIsDerivedEnabled] = useState(false);
      const [derivedTriggerValue, setDerivedTriggerValue] = useState('');
      const [derivedLabel, setDerivedLabel] = useState('');
      const [derivedType, setDerivedType] = useState('text');
      const [derivedOptions, setDerivedOptions] = useState('');
      const [isSubDerivedEnabled, setIsSubDerivedEnabled] = useState(false);
      const [subDerivedTriggerValue, setSubDerivedTriggerValue] = useState('');
      const [subDerivedLabel, setSubDerivedLabel] = useState('');
      const [subDerivedType, setSubDerivedType] = useState('text');
      const [subDerivedOptions, setSubDerivedOptions] = useState('');
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [editingInterviewQuestion, setEditingInterviewQuestion] = useState(null);

      const handleAddInterviewQuestion = async (e) => {
        e.preventDefault();
        if (!newIQLabel.trim()) return;
        const opts = newIQType === 'select' ? newIQOptions.split(',').map(s => s.trim()).filter(Boolean) : [];
        const derivedOpts = derivedType === 'select' ? derivedOptions.split(',').map(s => s.trim()).filter(Boolean) : [];
        const subDerivedOpts = subDerivedType === 'select' ? subDerivedOptions.split(',').map(s => s.trim()).filter(Boolean) : [];

        const subDerivedObj = isSubDerivedEnabled && subDerivedLabel.trim() ? {
          id: `sdiq-${Date.now()}`,
          label: subDerivedLabel.trim(),
          type: subDerivedType,
          options: subDerivedOpts,
          triggerValue: subDerivedTriggerValue.trim()
        } : null;

        const derivedObj = isDerivedEnabled && derivedLabel.trim() ? {
          id: `diq-${Date.now()}`,
          label: derivedLabel.trim(),
          type: derivedType,
          options: derivedOpts,
          triggerValue: derivedTriggerValue.trim(),
          derivedQuestion: subDerivedObj
        } : null;

        await saveInterviewQuestion({
          id: `iq-${Date.now()}`,
          label: newIQLabel.trim(),
          type: newIQType,
          required: newIQRequired,
          options: opts,
          order: interviewQuestions.length,
          derivedQuestion: derivedObj
        });
        setNewIQLabel('');
        setNewIQOptions('');
        setIsDerivedEnabled(false);
        setDerivedTriggerValue('');
        setDerivedLabel('');
        setDerivedOptions('');
        setIsSubDerivedEnabled(false);
        setSubDerivedTriggerValue('');
        setSubDerivedLabel('');
        setSubDerivedOptions('');
        showToast('Critério de entrevista com derivada condicional adicionado!');
      };

      const handleSaveEditedInterviewQuestion = async (e) => {
        e.preventDefault();
        if (!editingInterviewQuestion || !editingInterviewQuestion.label.trim()) return;
        const opts = editingInterviewQuestion.type === 'select' ? (typeof editingInterviewQuestion.options === 'string' ? editingInterviewQuestion.options.split(',').map(s => s.trim()).filter(Boolean) : editingInterviewQuestion.options) : [];
        const derivedOpts = editingInterviewQuestion.derivedType === 'select' ? (typeof editingInterviewQuestion.derivedOptions === 'string' ? editingInterviewQuestion.derivedOptions.split(',').map(s => s.trim()).filter(Boolean) : editingInterviewQuestion.derivedOptions) : [];
        const subDerivedOpts = editingInterviewQuestion.subDerivedType === 'select' ? (typeof editingInterviewQuestion.subDerivedOptions === 'string' ? editingInterviewQuestion.subDerivedOptions.split(',').map(s => s.trim()).filter(Boolean) : editingInterviewQuestion.subDerivedOptions) : [];

        const subDerivedObj = editingInterviewQuestion.isSubDerivedEnabled && editingInterviewQuestion.subDerivedLabel ? {
          id: editingInterviewQuestion.derivedQuestion?.derivedQuestion?.id || `sdiq-${Date.now()}`,
          label: editingInterviewQuestion.subDerivedLabel.trim(),
          type: editingInterviewQuestion.subDerivedType || 'text',
          options: subDerivedOpts,
          triggerValue: editingInterviewQuestion.subDerivedTriggerValue?.trim() || ''
        } : null;

        const derivedObj = editingInterviewQuestion.isDerivedEnabled && editingInterviewQuestion.derivedLabel ? {
          id: editingInterviewQuestion.derivedQuestion?.id || `diq-${Date.now()}`,
          label: editingInterviewQuestion.derivedLabel.trim(),
          type: editingInterviewQuestion.derivedType || 'text',
          options: derivedOpts,
          triggerValue: editingInterviewQuestion.derivedTriggerValue?.trim() || '',
          derivedQuestion: subDerivedObj
        } : null;

        await saveInterviewQuestion({
          ...editingInterviewQuestion,
          options: opts,
          derivedQuestion: derivedObj
        });
        setEditingInterviewQuestion(null);
        showToast('Critério de entrevista atualizado com sucesso!');
      };

      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      };

      const handleDrop = async (e, targetIndex) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === targetIndex) return;

        const updated = [...interviewQuestions];
        const [movedItem] = updated.splice(draggedIndex, 1);
        updated.splice(targetIndex, 0, movedItem);

        for (let i = 0; i < updated.length; i++) {
          const iq = updated[i];
          await saveInterviewQuestion({ ...iq, order: i });
        }

        setDraggedIndex(null);
        showToast('Ordem dos critérios de entrevista atualizada!');
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-5 bg-zinc-50 border border-zinc-200 rounded-2xl p-5 h-fit space-y-4">
            <h3 className="font-bold text-sm uppercase text-zinc-900">Novo Critério de Entrevista</h3>
            <form onSubmit={handleAddInterviewQuestion} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-zinc-600 mb-1">Título</label>
                <input type="text" required value={newIQLabel} onChange={(e) => setNewIQLabel(e.target.value)} className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-zinc-600 mb-1">Tipo</label>
                  <select value={newIQType} onChange={(e) => setNewIQType(e.target.value)} className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs font-semibold cursor-pointer">
                    <option value="textarea">Texto Longo</option>
                    <option value="text">Texto Curto</option>
                    <option value="select">Seleção</option>
                    <option value="date">Data</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-zinc-600 mb-1">Obrigatória?</label>
                  <select value={String(newIQRequired)} onChange={(e) => setNewIQRequired(e.target.value === 'true')} className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs font-semibold cursor-pointer">
                    <option value="true">Sim</option>
                    <option value="false">Não</option>
                  </select>
                </div>
              </div>
              {newIQType === 'select' && (
                <div>
                  <label className="block text-xs font-semibold text-zinc-600 mb-1">Opções (separadas por vírgula)</label>
                  <input
                    type="text"
                    value={newIQOptions}
                    onChange={(e) => setNewIQOptions(e.target.value)}
                    placeholder="Ex: Excelente, Bom, Regular"
                    className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs"
                  />
                </div>
              )}

              {/* Toggle Switch para Critério Derivado de Entrevista */}
              <div className="pt-3 border-t border-zinc-200 space-y-3">
                <div className="flex items-center justify-between">
                  <div>
                    <span className="font-bold text-xs text-zinc-900 block">Adicionar Critério Derivado</span>
                    <span className="text-[11px] text-zinc-500">Sub-critério ativado via toggle switch</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsDerivedEnabled(!isDerivedEnabled)}
                    className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                      isDerivedEnabled ? 'bg-emerald-600' : 'bg-zinc-300'
                    }`}
                  >
                    <span
                      className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${
                        isDerivedEnabled ? 'translate-x-5' : 'translate-x-0'
                      }`}
                    />
                  </button>
                </div>

                {isDerivedEnabled && (
                  <div className="p-3 bg-white rounded-xl border border-zinc-200 space-y-3 shadow-2xs">
                    <div>
                      <label className="block text-[11px] font-semibold text-zinc-600 mb-1">Qual resposta ativa este critério derivado?</label>
                      <input type="text" value={derivedTriggerValue} onChange={(e) => setDerivedTriggerValue(e.target.value)} placeholder="Ex: Bom (ou deixe em branco para qualquer resposta)" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-zinc-600 mb-1">Título do Critério Derivado:</label>
                      <input type="text" value={derivedLabel} onChange={(e) => setDerivedLabel(e.target.value)} placeholder="Ex: Justifique a avaliação..." className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Tipo</label>
                        <select value={derivedType} onChange={(e) => setDerivedType(e.target.value)} className="w-full px-2.5 py-1.5 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold">
                          <option value="text">Texto Curto</option>
                          <option value="textarea">Texto Longo</option>
                          <option value="select">Seleção</option>
                        </select>
                      </div>
                      {derivedType === 'select' && (
                        <div>
                          <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Opções (,)</label>
                          <input type="text" value={derivedOptions} onChange={(e) => setDerivedOptions(e.target.value)} placeholder="Op1, Op2" className="w-full px-2.5 py-1.5 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                        </div>
                      )}
                    </div>

                    <div className="pt-2 border-t border-zinc-100 space-y-2">
                      <div className="flex items-center justify-between">
                        <div>
                          <span className="font-bold text-[11px] text-zinc-900 block">Derivada da Derivada</span>
                        </div>
                        <button
                          type="button"
                          onClick={() => setIsSubDerivedEnabled(!isSubDerivedEnabled)}
                          className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                            isSubDerivedEnabled ? 'bg-emerald-600' : 'bg-zinc-300'
                          }`}
                        >
                          <span
                            className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${
                              isSubDerivedEnabled ? 'translate-x-4' : 'translate-x-0'
                            }`}
                          />
                        </button>
                      </div>

                      {isSubDerivedEnabled && (
                        <div className="p-2.5 bg-zinc-50 rounded-lg border border-zinc-200 space-y-2">
                          <div>
                            <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Qual resposta ativa esta sub-derivada?</label>
                            <input type="text" value={subDerivedTriggerValue} onChange={(e) => setSubDerivedTriggerValue(e.target.value)} placeholder="Ex: Regular" className="w-full px-2.5 py-1.5 bg-white border border-zinc-300 rounded-lg text-xs" />
                          </div>
                          <input type="text" value={subDerivedLabel} onChange={(e) => setSubDerivedLabel(e.target.value)} placeholder="Título da sub-sub-pergunta..." className="w-full px-2.5 py-1.5 bg-white border border-zinc-300 rounded-lg text-xs" />
                          <select value={subDerivedType} onChange={(e) => setSubDerivedType(e.target.value)} className="w-full px-2 py-1 bg-white border border-zinc-300 rounded-lg text-xs font-semibold">
                            <option value="text">Texto Curto</option>
                            <option value="textarea">Texto Longo</option>
                            <option value="select">Seleção</option>
                          </select>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>

              <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white text-xs font-semibold rounded-lg cursor-pointer shadow-sm">
                Adicionar Critério
              </button>
            </form>
          </div>
          <div className="lg:col-span-7 space-y-2.5">
            <p className="text-xs text-zinc-500 mb-2 font-medium">💡 Dica: Arraste e solte os itens abaixo para reposicionar a ordem dos critérios de entrevista.</p>
            {interviewQuestions.map((iq, idx) => (
              <div
                key={iq.id}
                draggable
                onDragStart={(e) => handleDragStart(e, idx)}
                onDragOver={(e) => handleDragOver(e, idx)}
                onDrop={(e) => handleDrop(e, idx)}
                className="p-3.5 bg-white rounded-xl border border-zinc-200 flex items-center justify-between gap-3 shadow-2xs cursor-grab active:cursor-grabbing hover:border-zinc-400 transition"
              >
                <div className="flex items-center gap-3 min-w-0">
                  <div className="text-zinc-400 shrink-0">
                    <Icon name="grip-vertical" className="w-4 h-4" />
                  </div>
                  <div className="min-w-0">
                    <span className="font-bold text-xs text-zinc-950 block truncate">{idx + 1}. {iq.label}</span>
                    <span className="text-[10px] text-zinc-500 uppercase font-semibold">
                      Tipo: {iq.type} {iq.derivedQuestion ? `• [Possui Derivada (ativa com: "${iq.derivedQuestion.triggerValue || 'qualquer'}") ${iq.derivedQuestion.derivedQuestion ? ' em Cascata' : ''}]` : ''}
                    </span>
                  </div>
                </div>
                <div className="flex items-center gap-1 shrink-0">
                  <button type="button" onClick={() => setEditingInterviewQuestion({ 
                    ...iq, 
                    options: iq.options ? iq.options.join(', ') : '', 
                    isDerivedEnabled: !!iq.derivedQuestion, 
                    derivedTriggerValue: iq.derivedQuestion?.triggerValue || '',
                    derivedLabel: iq.derivedQuestion?.label || '', 
                    derivedType: iq.derivedQuestion?.type || 'text', 
                    derivedOptions: iq.derivedQuestion?.options ? iq.derivedQuestion.options.join(', ') : '',
                    isSubDerivedEnabled: !!iq.derivedQuestion?.derivedQuestion,
                    subDerivedTriggerValue: iq.derivedQuestion?.derivedQuestion?.triggerValue || '',
                    subDerivedLabel: iq.derivedQuestion?.derivedQuestion?.label || '',
                    subDerivedType: iq.derivedQuestion?.derivedQuestion?.type || 'text',
                    subDerivedOptions: iq.derivedQuestion?.derivedQuestion?.options ? iq.derivedQuestion.derivedQuestion.options.join(', ') : ''
                  })} className="p-1.5 text-zinc-400 hover:text-zinc-900 rounded-lg cursor-pointer" title="Editar critério">
                    <Icon name="edit-2" className="w-4 h-4" />
                  </button>
                  <button type="button" onClick={() => removeInterviewQuestion(iq.id)} className="p-1.5 text-zinc-400 hover:text-red-600 rounded-lg cursor-pointer shrink-0" title="Apagar critério">
                    <Icon name="trash-2" className="w-4 h-4" />
                  </button>
                </div>
              </div>
            ))}
          </div>

          {editingInterviewQuestion && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 no-print">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-zinc-200 pb-3">
                  <h3 className="font-bold text-base text-zinc-950">Editar Critério de Entrevista</h3>
                  <button onClick={() => setEditingInterviewQuestion(null)} className="p-1 text-zinc-400 hover:text-zinc-900 rounded-lg cursor-pointer">
                    <Icon name="x-circle" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveEditedInterviewQuestion} className="space-y-4 text-sm">
                  <div>
                    <label className="block text-xs font-semibold text-zinc-600 mb-1">Título</label>
                    <input type="text" required value={editingInterviewQuestion.label} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, label: e.target.value }))} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-zinc-600 mb-1">Tipo</label>
                      <select value={editingInterviewQuestion.type} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, type: e.target.value }))} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold cursor-pointer">
                        <option value="textarea">Texto Longo</option>
                        <option value="text">Texto Curto</option>
                        <option value="select">Seleção</option>
                        <option value="date">Data</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-zinc-600 mb-1">Obrigatória?</label>
                      <select value={String(editingInterviewQuestion.required)} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, required: e.target.value === 'true' }))} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold cursor-pointer">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                      </select>
                    </div>
                  </div>

                  {editingInterviewQuestion.type === 'select' && (
                    <div>
                      <label className="block text-xs font-semibold text-zinc-600 mb-1">Opções (separadas por vírgula)</label>
                      <input
                        type="text"
                        value={editingInterviewQuestion.options}
                        onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, options: e.target.value }))}
                        placeholder="Ex: Excelente, Bom, Regular"
                        className="w-full px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-lg text-xs"
                      />
                    </div>
                  )}

                  <div className="pt-3 border-t border-zinc-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="font-bold text-xs text-zinc-900 block">Critério Derivado</span>
                        <span className="text-[11px] text-zinc-500">Sub-critério ativado via toggle switch</span>
                      </div>
                      <button
                        type="button"
                        onClick={() => setEditingInterviewQuestion(prev => ({ ...prev, isDerivedEnabled: !prev.isDerivedEnabled }))}
                        className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                          editingInterviewQuestion.isDerivedEnabled ? 'bg-emerald-600' : 'bg-zinc-300'
                        }`}
                      >
                        <span
                          className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${
                            editingInterviewQuestion.isDerivedEnabled ? 'translate-x-5' : 'translate-x-0'
                          }`}
                        />
                      </button>
                    </div>

                    {editingInterviewQuestion.isDerivedEnabled && (
                      <div className="p-3 bg-zinc-50 rounded-xl border border-zinc-200 space-y-3">
                        <div>
                          <label className="block text-[11px] font-semibold text-zinc-600 mb-1">Qual resposta ativa este critério derivado?</label>
                          <input type="text" value={editingInterviewQuestion.derivedTriggerValue || ''} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, derivedTriggerValue: e.target.value }))} placeholder="Ex: Bom" className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs" />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold text-zinc-600 mb-1">Título do Critério Derivado:</label>
                          <input type="text" value={editingInterviewQuestion.derivedLabel || ''} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, derivedLabel: e.target.value }))} placeholder="Ex: Detalhes..." className="w-full px-3 py-2 bg-white border border-zinc-300 rounded-lg text-xs" />
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Tipo</label>
                            <select value={editingInterviewQuestion.derivedType || 'text'} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, derivedType: e.target.value }))} className="w-full px-2.5 py-1.5 bg-white border border-zinc-300 rounded-lg text-xs font-semibold">
                              <option value="text">Texto Curto</option>
                              <option value="textarea">Texto Longo</option>
                              <option value="select">Seleção</option>
                            </select>
                          </div>
                          {editingInterviewQuestion.derivedType === 'select' && (
                            <div>
                              <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Opções (,)</label>
                              <input type="text" value={editingInterviewQuestion.derivedOptions || ''} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, derivedOptions: e.target.value }))} placeholder="Op1, Op2" className="w-full px-2.5 py-1.5 bg-white border border-zinc-300 rounded-lg text-xs" />
                            </div>
                          )}
                        </div>

                        <div className="pt-2 border-t border-zinc-200 space-y-2">
                          <div className="flex items-center justify-between">
                            <div>
                              <span className="font-bold text-[11px] text-zinc-900 block">Derivada da Derivada</span>
                            </div>
                            <button
                              type="button"
                              onClick={() => setEditingInterviewQuestion(prev => ({ ...prev, isSubDerivedEnabled: !prev.isSubDerivedEnabled }))}
                              className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                                editingInterviewQuestion.isSubDerivedEnabled ? 'bg-emerald-600' : 'bg-zinc-300'
                              }`}
                            >
                              <span
                                className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow-lg ring-0 transition duration-200 ease-in-out ${
                                  editingInterviewQuestion.isSubDerivedEnabled ? 'translate-x-4' : 'translate-x-0'
                                }`}
                              />
                            </button>
                          </div>

                          {editingInterviewQuestion.isSubDerivedEnabled && (
                            <div className="p-2 bg-white rounded-lg border border-zinc-200 space-y-2">
                              <div>
                                <label className="block text-[10px] font-semibold text-zinc-600 mb-1">Qual resposta ativa esta sub-derivada?</label>
                                <input type="text" value={editingInterviewQuestion.subDerivedTriggerValue || ''} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, subDerivedTriggerValue: e.target.value }))} placeholder="Ex: Regular" className="w-full px-2 py-1 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                              </div>
                              <input type="text" value={editingInterviewQuestion.subDerivedLabel || ''} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, subDerivedLabel: e.target.value }))} placeholder="Título da sub-sub-pergunta..." className="w-full px-2 py-1 bg-zinc-50 border border-zinc-300 rounded-lg text-xs" />
                              <select value={editingInterviewQuestion.subDerivedType || 'text'} onChange={(e) => setEditingInterviewQuestion(prev => ({ ...prev, subDerivedType: e.target.value }))} className="w-full px-2 py-1 bg-zinc-50 border border-zinc-300 rounded-lg text-xs font-semibold">
                                <option value="text">Texto Curto</option>
                                <option value="textarea">Texto Longo</option>
                                <option value="select">Seleção</option>
                              </select>
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-zinc-200">
                    <button type="button" onClick={() => setEditingInterviewQuestion(null)} className="px-4 py-2 bg-zinc-100 text-zinc-700 text-xs font-semibold rounded-lg cursor-pointer">
                      Cancelar
                    </button>
                    <button type="submit" className="px-5 py-2 bg-zinc-900 text-white text-xs font-semibold rounded-lg cursor-pointer shadow-sm">
                      Salvar Alterações
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
